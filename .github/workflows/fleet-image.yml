# Build and publish the fleet-server container image to GHCR.
#
# The fleet box pulls this; it never builds it. Unlike the inference image this
# one is a plain python base plus two pure wheels — tens of megabytes, seconds
# to build — so it is
# cheap enough to build on every push that touches it, and cheap enough for a
# box with no registry access to build from a checkout instead
# (`fleet-deploy.sh up --build`).
name: fleet-image

on:
  push:
    branches: [main]
    paths:
      - mote_fleet/deploy/Dockerfile
      - mote_fleet/server/fleet_server.py
      - mote_fleet/server/registry.py
      - mote_fleet/server/fleetctl.py
      - mote_fleet/server/bundle_store.py
      - mote_fleet/server/ui/**
      - mote_fleet/mote_fleet/protocol.py
      - mote_bringup/mote_bringup/bundle.py
      - .dockerignore
      - .github/workflows/fleet-image.yml
    # Every path COPYed by the Dockerfile is listed above. A fix to the
    # validator or the dashboard that does not rebuild the image ships
    # nothing, and the fleet box keeps serving the old one.
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/mote-fleet

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # so `git describe` can see tags for the baked version

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # `latest` is what env.example pins; the sha and semver tags are what a
          # box pins to when it wants a reproducible deploy or a rollback target.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Version string
        id: version
        run: echo "value=$(git describe --always --tags)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: mote_fleet/deploy/Dockerfile
          # The fleet box may well be a Pi, so build for it too. The image is
          # pure python, so the second platform costs almost nothing.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MOTE_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
