name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest # linux-64
          - runner: ubuntu-24.04-arm # linux-aarch64, same arch as the Pi
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          cache: true

      - name: Build
        run: pixi run build

      - name: Test
        run: pixi run test

      # The fleet server is meant to run on a box with no ROS and no checkout of
      # the robot software. Running its tests in the ROS-free `fleet` env is what
      # keeps that true: a stray `import rclpy` in the server fails here rather
      # than on the fleet box. Cheap — the env is a broker and Python.
      - name: Test fleet server (no ROS)
        run: pixi run -e fleet test-fleet
