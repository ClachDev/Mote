name: build

# Prose, CAD and images cannot change what builds or what the tests see, so a
# change touching only those skips the job (docs.yml still checks the prose).
# `paths` rather than `paths-ignore` because only `paths` takes a negation, and
# one markdown file is test input: test_wifi_roaming.py reads the wifi README.
# A new test that reads a .md file must be re-included here the same way.
on:
  push:
    branches: [main]
    paths: &build-paths
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!design/**"
      - "!LICENSE"
      - "mote_bringup/wifi/README.md"
  pull_request:
    paths: *build-paths

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest # linux-64
          - runner: ubuntu-24.04-arm # linux-aarch64, same arch as the Pi
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true

      - name: Build
        run: pixi run build

      - name: Test
        run: pixi run test

      # The fleet server is meant to run on a box with no ROS and no checkout of
      # the robot software. Running its tests in the ROS-free `fleet` env is what
      # keeps that true: a stray `import rclpy` in the server fails here rather
      # than on the fleet box. Cheap — the env is a broker and Python.
      - name: Test fleet server (no ROS)
        run: pixi run -e fleet test-fleet
