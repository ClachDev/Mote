name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest # linux-64
          - runner: ubuntu-24.04-arm # linux-aarch64, same arch as the Pi
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          cache: true

      - name: Build
        run: pixi run build

      - name: Test
        run: pixi run test
