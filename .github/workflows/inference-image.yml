# Build and publish the inference-server container image to GHCR.
#
# The inference machine never builds this — that is the whole point of shipping a
# container: the target may be a gaming PC or a cloud instance with no repo, no
# toolchain, and no interest in becoming a dev environment. CI builds, GHCR hosts,
# the host pulls.
#
# Not built on every PR: the image is several GB and depends on a handful of
# files, so it builds when those change on main, on a tag, or on demand.
name: inference-image

on:
  push:
    branches: [main]
    paths:
      - mote_perception/deploy/Dockerfile
      - mote_perception/tools/depth_server.py
      - mote_perception/tools/detect_server.py
      - mote_perception/tools/inference_server.py
      - mote_perception/tools/model_host.py
      - mote_perception/tools/prefetch_models.py
      - mote_perception/mote_perception/depth_wire.py
      - mote_perception/mote_perception/detect_wire.py
      - .github/workflows/inference-image.yml
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/mote-inference

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # so `git describe` can see tags for the baked version

      # A CUDA torch wheel plus baked model weights does not fit comfortably in
      # the runner's default free space; drop toolchains this build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # `latest` is what the documented `docker run` line pulls; the sha and
          # semver tags let a host pin a known-good build and roll back.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Version string
        id: version
        run: echo "value=$(git describe --always --tags)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: mote_perception/deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MOTE_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
