name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment makes the plugin post its findings to the PR; without it the
          # review is printed to stdout and discarded.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # In agent mode the action installs the github_inline_comment MCP server
          # only when an mcp__github_inline_comment__* tool appears here, so the
          # plugin's inline-comment step has no tool to call without this list.
          # The Bash entries are the read-only commands the plugin's agents run.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # Names the tools Claude was denied, without printing the transcript that
      # show_full_output would expose.
      - name: Report permission denials
        if: always() && steps.claude-review.outputs.execution_file != ''
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [ ! -f "$EXECUTION_FILE" ]; then
            echo "No execution file at $EXECUTION_FILE"
            exit 0
          fi
          jq -r '
            [ .[] | select(.type == "result") | (.permission_denials // [])[] | .tool_name ]
            | if length == 0 then "No permission denials."
              else "Denied tools: " + (group_by(.) | map("\(.[0]) x\(length)") | join(", "))
              end
          ' "$EXECUTION_FILE"
