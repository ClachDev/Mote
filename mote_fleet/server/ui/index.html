<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` so the tab bar can sit in the home-indicator area
         rather than above it; the safe-area inset in style.css keeps it
         tappable. The page does its own pinch-zoom on the map canvas, but
         browser zoom is deliberately left enabled: nothing here is worth
         taking that away from someone reading a status line. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>mote fleet</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>mote<span class="dim">/fleet</span></h1>
      <span id="contract" class="pill">…</span>
      <span id="broker-state" class="broker connecting">broker connecting…</span>
      <form id="token-form" class="token-form">
        <input
          id="token"
          type="password"
          placeholder="operator token"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit">use</button>
      </form>
      <span id="operator" class="operator anonymous">read-only</span>
    </header>

    <main>
      <section class="pane roster-pane active" data-pane="roster">
        <h2>roster</h2>
        <div id="roster" class="roster"></div>
      </section>

      <section class="pane map-pane" data-pane="map">
        <div class="pane-head">
          <h2>map</h2>
          <span id="map-label" class="dim">—</span>
          <span id="map-revision" class="pill"></span>
          <!-- A candidate is a map a robot published; it changes nothing until
               an operator promotes it. Promotion, and editing its zones, happen
               in the review pane where that candidate's own map is on screen —
               this is the way in. It is always here, and says how many
               candidates the floor on screen has when it knows: above 760 px
               the tab bar is hidden, so a conditional button was the only door
               to a pane whose whole point is floors no robot is reporting. -->
          <button id="review-jump" type="button">review maps</button>
          <label class="check"><input type="checkbox" id="follow" /> follow</label>
          <button id="fit" type="button">fit</button>
        </div>
        <canvas id="map-canvas"></canvas>
      </section>

      <!-- Candidate review. Addressed by floor rather than by robot: the floor
           worth reviewing is often one no robot is reporting. Everything it
           reads is a GET of a *revision's* own routes, so what is on the canvas
           is the map about to be promoted and not the one already published. -->
      <section class="pane review-pane" data-pane="review">
        <div class="pane-head">
          <!-- The way out. Review is a mode: it stands every other pane down at
               every width, and above 760 px the tab bar that would bring one
               back is hidden — so this button, and Escape, are the only exits.
               Both are held off while a zone edit is live, which owns the pane
               until it is saved or cancelled, as the revision list is. -->
          <button id="review-back" type="button">back to map</button>
          <h2>review</h2>
          <span id="review-map-label" class="dim">—</span>
          <button id="review-fit" type="button">fit</button>
        </div>

        <div class="review-body">
          <div class="review-side">
            <div id="review-floors" class="review-floors" hidden>
              <label for="review-floor">site / floor</label>
              <select id="review-floor" title="site and floor to review"></select>
            </div>
            <p class="dim">
              published: <span id="review-canonical" class="pill">—</span>
            </p>
            <div id="review-revisions" class="revision-rows"></div>

            <!-- A state, said the way every other state on this page is said:
                 a coloured dot and a word. What the list underneath it is —
                 and whether it blocks the button — is a caption on the list,
                 not a sentence standing in for the state. -->
            <h3>validation</h3>
            <p id="review-verdict" class="verdict"></p>
            <p id="review-notes-label" class="notes-label" hidden></p>
            <ul id="review-verdict-notes" class="verdict-notes"></ul>

            <h3>provenance</h3>
            <div id="review-provenance" class="facts"></div>

            <button id="review-promote" type="button" class="promote" disabled>
              promote this revision
            </button>
            <p id="review-note" class="note"></p>
          </div>

          <div class="review-map">
            <canvas id="review-canvas"></canvas>
            <!-- One box, whichever mode is in it. The editing surface is taller
                 than the list it replaces, and with the canvas taking the
                 remaining height that difference came out of the map: clicking
                 `edit zones` resized the thing being edited. -->
            <div class="zones-panel">
            <div class="zones-head">
              <h3>zones</h3>
              <!-- Which map frame these coordinates were taught in, said only
                   when it is not this one: a revision carrying no zones is
                   drawn with the floor's, which were taught on a different map.
                   The trap M4 named, as a state rather than a caption. -->
              <span id="review-zone-source" class="pill warn" hidden></span>
              <!-- Editing is on the *selected revision*, which is why it is
                   here and not on the operations map: a zone is a coordinate
                   in one map frame, so the map under it has to be the map it
                   belongs to. Saving derives a new candidate; the revision on
                   screen is never written. -->
              <button id="zones-edit" type="button" hidden>edit zones</button>
              <!-- The edit ends where it began. These two replace `edit zones`
                   in the same spot, because they are the same level of thing:
                   what starts and finishes the whole edit. `add zone` is not —
                   it acts on one item, so it lives at the foot of the items. -->
              <button id="zone-save" type="button" hidden>save as candidate</button>
              <button id="zone-cancel" type="button" hidden>cancel</button>
            </div>
            <!-- One list, whether or not it is being edited: the same rows with
                 text where the controls go. Two renderers were two layouts that
                 drifted, and the difference between looking and editing should
                 be the controls rather than the page. -->
            <div id="zone-rows" class="zone-rows"></div>
            <!-- What the save says, under the list it is about. It has no
                 height until there is something to say, so the room comes out
                 of the one thing here that scrolls. -->
            <p id="zone-note" class="note"></p>
            <div id="zone-editor" class="zone-editor" hidden>
              <div class="zones-head"><h3>details</h3></div>
              <!-- The selected zone's vocabulary. A row per zone carries what
                   you compare across zones; this carries what belongs to one
                   of them, and is where a new zone/v0 field lands without
                   costing every row a column. -->
              <div id="zone-detail" class="zone-detail"></div>
            </div>
            </div>
          </div>
        </div>
      </section>

      <section class="pane detail-pane" data-pane="detail">
        <div class="pane-head">
          <h2 id="detail-name">no robot selected</h2>
          <!-- Foxglove owns the single-robot deep view: 3D, sensors, teleop.
               This dashboard owns the fleet-wide 2D picture and links out. -->
          <a
            id="foxglove"
            class="button"
            title="Opens the Foxglove desktop app against this robot's foxglove_bridge (M2). Needs both."
            hidden
            >open in Foxglove</a
          >
        </div>

        <!-- Everything in this pane is retained state. When it has stopped
             being a claim about now, this says so before the reader trusts a
             green dot. -->
        <p id="detail-stale" class="stale-banner" hidden></p>

        <div id="detail-meta" class="facts"></div>

        <h3>subsystems</h3>
        <div id="subsystems" class="subsystems"></div>

        <h3>dispatch</h3>
        <form id="dispatch" class="dispatch" hidden>
          <!-- The grammar is still the robot's, parsed only by its task layer.
               This picker types for you — it writes `goto <zone>` into the same
               box — because on a touchscreen the cost of a command is the
               keyboard, and the zone names are already on screen. -->
          <select id="zone" class="zone-picker" title="taught zones on this floor" hidden>
            <option value="">go to a taught zone…</option>
          </select>
          <input
            id="command"
            type="text"
            placeholder="goto kitchen — or: fetch red_box dropoff"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <button type="submit">send</button>
          <p id="dispatch-note" class="note"></p>
        </form>

        <h3>task status</h3>
        <div id="status-log" class="status-log"></div>
      </section>
    </main>

    <!-- Only on a viewport too narrow for three panes (style.css). At the
         bottom because the operator asking "where is it" is holding the phone
         in one hand. -->
    <nav class="panes" role="tablist" aria-label="view">
      <button type="button" data-pane="roster" role="tab" aria-selected="true" class="active">
        roster
      </button>
      <button type="button" data-pane="map" role="tab" aria-selected="false">map</button>
      <button type="button" data-pane="review" role="tab" aria-selected="false">review</button>
      <button type="button" id="tab-detail" data-pane="detail" role="tab" aria-selected="false">
        robot
      </button>
    </nav>

    <script type="module" src="/app.mjs"></script>
  </body>
</html>
