# Mosquitto for the Mote fleet control plane (pixi run fleet-broker).
#
# Small on purpose. Mosquitto is a single process that does not cluster, which
# is exactly right for a homelab fleet and exactly the thing to swap for EMQX or
# HiveMQ at Regime B/C -- same protocol, same topic tree, same agent code, so
# that swap is a broker change and not a redesign (fleet.md Q2).
#
# SECURITY: anonymous. Every client on the tailnet may publish and subscribe
# anywhere in the tree. That is the M0 substrate's bargain -- WireGuard is the
# authentication boundary and nothing here is reachable from the public internet
# -- and it is what M7 replaces with per-robot credentials (username = robot_id,
# publish confined to its own prefix) and a subscribe-only operator credential.
# Until then: do not put this broker on an interface the robots are not already
# trusted on. The bind line below is the lever for that.

# The control-plane listener the agents connect to. Left unbound (all
# interfaces) because a fresh fleet box has no stable tailnet address to name
# yet; on a real one, pin it:
#     listener 1883 100.x.y.z          # the box's Tailscale address
listener 1883
allow_anonymous true

# >>> websockets
# MQTT-over-WebSockets, for the M3 fleet dashboard: a browser cannot speak raw
# MQTT, so a UI that subscribes to mote/v1/+/health directly -- no polling, no
# service in the middle (fleet.md Q5) -- needs this listener.
#
# conda-forge's mosquitto is built WITHOUT libwebsockets and refuses to start if
# it sees these two lines (docs/fleet/m1-verification.md S4). broker.sh deletes
# this block, markers and all, when the binary it is about to run cannot honour
# it -- so the file stays one config, and the fleet box runs it intact by
# running mosquitto in a container, which is what `pixi run fleet-broker` and
# the deployed stack both do.
listener 9001
protocol websockets
# <<< websockets

# Retained messages and QoS-1 queues survive a broker restart, so the roster is
# not blank until every robot's next heartbeat.
persistence true
persistence_file mosquitto.db

# Journald/stdout: the broker is run by systemd or by hand, never daemonised.
#
# log_type is deliberately not set. Setting it *replaces* mosquitto's default
# set rather than adding to it, so naming warning+notice silently drops
# `error` -- and the two errors that matter most here are the ones that make
# the broker exit: a port already in use, and a websockets listener a build
# cannot honour. The default set also logs which listeners opened, which is the
# direct answer to "is the dashboard's WebSocket listener up?".
log_dest stdout
connection_messages true
