# Named navigation targets for office_world.sdf (the medium hospital-ward
# corridor: 22 m x 2 m corridor, five 4.4 m rooms per side with doorways at
# y=+/-1 centred on each room). pickup and dropoff sit in rooms at opposite
# ends and sides, so a fetch traverses most of the corridor and two doorways.
frame_id: map
zones:
  pickup: {x: -8.8, y: 3.5, yaw: 1.571, kind: pickup}
  dropoff: {x: 8.8, y: -3.5, yaw: -1.571, kind: dropoff}
  home: {x: 0.0, y: 0.0, yaw: 0.0, kind: home}
  # Room zones reachable by `goto <name>`; the radius gives each an area
  # footprint. One per ward room, centred well inside the 4.4 m-wide rooms
  # (side walls at x = +/-2.2, +/-6.6) and short of the back walls, facing into
  # the room from its doorway.
  pharmacy: {x: -4.4, y: 3.0, yaw: 1.571, radius: 1.3, kind: room}
  kitchen: {x: 4.4, y: 3.0, yaw: 1.571, radius: 1.3, kind: room}
  lab: {x: -4.4, y: -3.0, yaw: -1.571, radius: 1.3, kind: room}
  office: {x: 4.4, y: -3.0, yaw: -1.571, radius: 1.3, kind: room}
