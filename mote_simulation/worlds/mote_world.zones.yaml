# Named navigation targets for mote_world.sdf (the 6x6 m smoke-test room;
# obstacles sit at (1.5, 1.0) and (-1.2, -1.5)). Mirrors mote_tasks'
# zones.default.yaml, the on-robot fallback. Every world has a sibling
# <world>.zones.yaml with the same zone names, loaded by sim_launch.py when a
# mission mode is up, so `fetch pickup dropoff` runs anywhere on the ladder.
frame_id: map
zones:
  pickup: {x: 1.8, y: -1.5, yaw: 0.0}
  dropoff: {x: -1.8, y: 1.5, yaw: 3.14}
  home: {x: 0.0, y: 0.0, yaw: 0.0}
  # Room-like zones reachable by `goto <name>`; the radius gives them an area
  # footprint. This single 6x6 room has no real rooms, so these are token areas
  # clear of the two obstacles.
  kitchen: {x: 2.0, y: 2.0, yaw: 0.0, radius: 1.0}
  lounge: {x: -2.0, y: 2.0, yaw: 3.14, radius: 1.0}
