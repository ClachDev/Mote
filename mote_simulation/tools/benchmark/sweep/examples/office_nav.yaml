# Example parameter sweep: tune Nav2 for office_world (the medium corridor world).
#
# Three parameters the task calls out — AMCL particle count, costmap inflation
# radius, and a controller velocity/accel limit — each at two levels around the
# committed default, so the grid is 2^3 = 8 sets plus the all-defaults baseline.
# Run it with:
#     pixi run bench-sweep mote_simulation/tools/benchmark/sweep/examples/office_nav.yaml
# Preview the plan without launching a sim:
#     pixi run bench-sweep <this file> --dry-run
name: office_nav

benchmark:
  worlds: [office_world.sdf]
  trials: 2
  goal_timeout: 180        # office legs are longer than mote_world's
  order: pickup,dropoff,home
  settle: 8

parameters:
  # AMCL particle ceiling: more particles = steadier localization, more CPU.
  - name: amcl_max_particles
    file: nav2
    path: amcl.ros__parameters.max_particles
    values: [2000, 3000]

  # Costmap inflation radius, applied to BOTH costmaps so the planner and the
  # local controller agree. Lower = tighter, faster corridor paths; higher =
  # more margin. Uses list-form key paths (robust to literal dotted keys).
  - name: inflation_radius
    file: nav2
    paths:
      - [local_costmap, local_costmap, ros__parameters, inflation_layer, inflation_radius]
      - [global_costmap, global_costmap, ros__parameters, inflation_layer, inflation_radius]
    values: [0.30, 0.35]

  # DWB forward-acceleration limit: higher lets the controller reach cruise speed
  # sooner (better time-to-goal), at some smoothness cost. The peak commanded
  # per-wheel speed is still gated by the WheelSpeedLimit critic against the
  # hardware wall, and the sweep's feasibility check re-verifies it.
  - name: dwb_acc_lim_x
    file: nav2
    path: controller_server.ros__parameters.FollowPath.acc_lim_x
    values: [1.0, 1.5]

scoring:
  weights:
    success: 3.0        # never trade goal completions for speed
    localization: 1.0
    time: 1.0
    smoothness: 0.5
