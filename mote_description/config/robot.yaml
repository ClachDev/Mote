# Single source of truth for robot configuration.
# Consumed by mote.urdf.xacro (via xacro.load_yaml) and mote_launch.py (via yaml.safe_load).

# Physical geometry — used by the URDF for visualization and by diff_drive_controller for odometry
wheel_radius: 0.0325
wheel_separation: 0.22

# Maximum wheel surface speed the servos sustain at the 5V supply — the hard
# ceiling measured from recorded odometry, not a datasheet value. Consumed by
# the Nav2 WheelSpeedLimit critic (injected via nav2_launch.py) to keep
# commanded (v, omega) within what the differential drive can actually deliver.
max_wheel_speed: 0.218

# Drive servo bus
servos:
  port: /dev/mote_servos
  baud_rate: 1000000
  left_id: 7
  right_id: 9
  velocity_scale: 674.1  # rad/s to servo speed units; measure with `ros2 run mote_hardware velocity_cal`
  acceleration: 0        # 0 = maximum acceleration

# SO-101 follower arm (Feetech STS-class servos on their own serial bus).
# Consumed by mote_arm (driver, jog CLI, arm_check) and by the arm section of
# mote.urdf.xacro. There is no leader arm — this is the follower only.
#
# CALIBRATION STATUS: the min/max and `zero` below are uncalibrated defaults.
# Calibration is per-robot and does not edit this file — `pixi run arm-calibrate`
# (mote_arm/BENCH.md step 3) saves to `$MOTE_HOME/arm.yaml`, which overrides
# these three fields per joint at load time. See DEFAULTS ONLY below.
#
# WIRING: the arm SHARES the drive-wheel bus (verified on the robot: IDs 1-6
# for the arm, 7/9 for the wheels, all on /dev/mote_servos). Consequences:
#   * arm IDs must never collide with the wheel IDs — mote_arm.config rejects
#     that at load time;
#   * only one process may open this port, so the arm driver cannot run at the
#     same time as the robot base (mote_launch and friends). mote_arm.bus
#     refuses to open a port another process already holds.
arm:
  port: /dev/mote_servos
  baud_rate: 1000000
  moving_speed: 500      # jog move speed cap, servo steps/s (gentle)
  moving_acc: 20         # 0-254, units of 100 steps/s^2
  # Position-loop gains, held in each servo's EEPROM. Recorded here so they
  # survive a servo swap and stay in one place with the rest of the arm config;
  # apply and verify them with `pixi run arm-gains apply`.
  #
  # The arm shipped with kp=16, which leaves a permanent steady-state error
  # under load: the servo settles where kp*error balances the holding torque and
  # ki=0 never integrates it away. `pixi run arm-gains sweep` measured it on
  # elbow_flex, -0.200 rad from rest (repeated; both runs agreed to 1-2 counts):
  #
  #   kp    16     32     64    128
  #   err  0.068  0.031  0.014  0.008 rad
  #   load  188    168    144    144  of 1000
  #
  # Error falls 8.2x for an 8x gain rise at a load nowhere near the 1000 that
  # torque saturation would pin it to: droop, and the 5.1-5.2 V supply is not
  # what limits it. 64 is chosen over the best-scoring 128 deliberately — it
  # takes half the remaining error and still leaves a measured 2x margin below
  # the highest gain tested, which matters because every regime that punishes a
  # stiff loop (a payload, a collision, hand-guiding) is untested, and this arm
  # exists to touch things. ki stays 0: ki=8 closed the error to 0.001 rad but
  # stretched settling from 0.46 s to 2.12 s, which a 20 Hz streamed setpoint
  # never waits for. See mote_arm/README.md.
  gains:
    kp: 64
    kd: 32
    ki: 0
  # min/max are soft limits in radians about each joint's zero; `zero` is the
  # raw encoder count (0-4095) that reads 0 rad.
  #
  # `zero` is NOT the arm's rest pose. After calibration 0 rad is the middle of
  # each joint's travel; the rest pose is a taught pose called "home" in
  # ~/.mote/arm_poses.yaml. The two were both called "home" until 2026-07-28,
  # which is exactly why this key is now spelled `zero` (`home:` is still
  # accepted for an un-migrated file).
  #
  # Calibration is `pixi run arm-calibrate`: it sweeps every joint to its
  # mechanical stops, writes each servo's homing-offset register so the measured
  # mid-travel reads 2048, and saves the resulting zeros and limits to
  # `$MOTE_HOME/arm.yaml`. Centring matters — without it a joint whose travel
  # straddles the encoder's 0/4095 wrap cannot be described by any zero/limit
  # pair at all, and two of six joints on the first real arm did.
  #
  # A pose is stored as radians about its joint's `zero`, so moving a zero
  # changes which physical position each number names. `arm-calibrate` rewrites
  # the taught poses by exactly the shift it applied, so they keep pointing
  # where they did; only a pose left outside the new limits needs a decision.
  #
  # DEFAULTS ONLY — a calibrated robot overrides `zero`/`min`/`max` per joint
  # from `$MOTE_HOME/arm.yaml` (written by `pixi run arm-calibrate`), because
  # those are measurements of one physical arm and every arm's differ. What
  # stays here is the design: ids, names, direction, gains.
  #
  # These particular numbers are the old pose-envelope output (`arm-pose
  # limits`) and describe where one arm had *been*, not where it can go — the
  # parked pose it was measured from sits within ~20 counts of a hard stop on
  # most joints, and shoulder_pan's [0.010, 0.229] does not contain its own
  # zero. Treat them as a conservative placeholder until a robot calibrates.
  joints:
    - {name: shoulder_pan,  id: 1, min:  0.010, max: 0.229, zero: 3013, invert: false}
    - {name: shoulder_lift, id: 2, min: -0.102, max: 0.100, zero: 1483, invert: false}
    - {name: elbow_flex,    id: 3, min: -3.291, max: 0.103, zero: 2931, invert: false}
    - {name: wrist_flex,    id: 4, min: -3.226, max: 0.097, zero: 2767, invert: false}
    - {name: wrist_roll,    id: 5, min: -0.098, max: 0.102, zero:  731, invert: false}
    - {name: gripper,       id: 6, min: -0.102, max: 0.098, zero: 2056, invert: false}

# Sensors
lidar:
  port: /dev/mote_lidar
  baud_rate: 460800
  # Simulated lidar parameters (RPLIDAR C1 datasheet values) — used only by
  # the use_sim branch of the URDF; the real driver gets these from the device
  sim:
    update_rate: 10.0
    samples: 720
    range_min: 0.05
    range_max: 12.0

camera:
  device: /dev/mote_camera
  image_size: [640, 480]
  # Default fallback intrinsics; a per-robot ~/.mote/camera_calibration.yaml overrides it.
  default_info_url: package://mote_perception/config/camera_info.default.yaml
  # Simulated camera parameters — used only by the use_sim branch of the URDF;
  # the real driver gets its intrinsics from default_info_url instead. The FOV
  # matches the calibrated real lens (fx ~469.6 over 640 px -> ~68.6deg) so sim
  # and real geometry stay consistent.
  sim:
    update_rate: 30.0
    horizontal_fov: 1.20
    width: 640
    height: 480
    near: 0.05
    far: 20.0
