# Single source of truth for robot configuration.
# Consumed by mote.urdf.xacro (via xacro.load_yaml) and mote_launch.py (via yaml.safe_load).

# Physical geometry — used by the URDF for visualization and by diff_drive_controller for odometry
wheel_radius: 0.0325
wheel_separation: 0.22

# Maximum wheel surface speed the servos sustain at the 5V supply — the hard
# ceiling measured from recorded odometry, not a datasheet value. Consumed by
# the Nav2 WheelSpeedLimit critic (injected via nav2_launch.py) to keep
# commanded (v, omega) within what the differential drive can actually deliver.
max_wheel_speed: 0.218

# Drive servo bus
servos:
  port: /dev/mote_servos
  baud_rate: 1000000
  left_id: 7
  right_id: 9
  velocity_scale: 674.1  # rad/s to servo speed units; measure with `ros2 run mote_hardware velocity_cal`
  acceleration: 0        # 0 = maximum acceleration

# SO-101 follower arm (Feetech STS-class servos on their own serial bus).
# Consumed by mote_arm (driver, jog CLI, arm_check) and by the arm section of
# mote.urdf.xacro. There is no leader arm — this is the follower only.
#
# CALIBRATION STATUS: min/max are conservative placeholders and `home` values
# are the arm's as-found resting counts, NOT taught mechanical zeros. Pose each
# joint at its true zero and re-run `pixi run arm-check -- --save-home` (see
# mote_arm/BENCH.md), then update here — robot.yaml is the single source of
# truth, so nothing else needs editing.
#
# WIRING: the arm SHARES the drive-wheel bus (verified on the robot: IDs 1-6
# for the arm, 7/9 for the wheels, all on /dev/mote_servos). Consequences:
#   * arm IDs must never collide with the wheel IDs — mote_arm.config rejects
#     that at load time;
#   * only one process may open this port, so the arm driver cannot run at the
#     same time as the robot base (mote_launch and friends). mote_arm.bus
#     refuses to open a port another process already holds.
arm:
  port: /dev/mote_servos
  baud_rate: 1000000
  moving_speed: 500      # jog move speed cap, servo steps/s (gentle)
  moving_acc: 20         # 0-254, units of 100 steps/s^2
  # min/max are soft limits in radians about each joint's zero. home is the raw
  # encoder count (0-4095) at that zero. The home values below are the arm's
  # as-found resting pose read off the robot, so "0 rad" currently means "the
  # pose it was parked in" — a safe reference that keeps jog moves small, but
  # not yet a true mechanical zero. Retach at the bench (BENCH.md step 3).
  joints:
    - {name: shoulder_pan,  id: 1, min: -1.90, max: 1.90, home: 3013, invert: false}
    - {name: shoulder_lift, id: 2, min: -1.75, max: 1.75, home: 1483, invert: false}
    - {name: elbow_flex,    id: 3, min: -1.60, max: 1.60, home: 2931, invert: false}
    - {name: wrist_flex,    id: 4, min: -1.75, max: 1.75, home: 2767, invert: false}
    - {name: wrist_roll,    id: 5, min: -2.70, max: 2.70, home:  731, invert: false}
    - {name: gripper,       id: 6, min:  0.00, max: 1.50, home: 2056, invert: false}

# Sensors
lidar:
  port: /dev/mote_lidar
  baud_rate: 460800
  # Simulated lidar parameters (RPLIDAR C1 datasheet values) — used only by
  # the use_sim branch of the URDF; the real driver gets these from the device
  sim:
    update_rate: 10.0
    samples: 720
    range_min: 0.05
    range_max: 12.0

camera:
  device: /dev/mote_camera
  image_size: [640, 480]
  # Default fallback intrinsics; a per-robot ~/.mote/camera_calibration.yaml overrides it.
  default_info_url: package://mote_perception/config/camera_info.default.yaml
  # Simulated camera parameters — used only by the use_sim branch of the URDF;
  # the real driver gets its intrinsics from default_info_url instead. The FOV
  # matches the calibrated real lens (fx ~469.6 over 640 px -> ~68.6deg) so sim
  # and real geometry stay consistent.
  sim:
    update_rate: 30.0
    horizontal_fov: 1.20
    width: 640
    height: 480
    near: 0.05
    far: 20.0
