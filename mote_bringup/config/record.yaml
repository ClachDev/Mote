# Rosbag recording streams — consumed by record_launch.py.
# Each stream writes to ~/.mote/bags/<name>/<timestamp>/ with its own segment
# length and rolling disk cap (enforced by bag_pruner).

streams:
  # Recorded automatically during mapping runs (mapping_launch.py record:=true,
  # the default) so save-map can stamp the session's bag into the map
  # revision's meta.yaml. Enough to re-run SLAM offline.
  mapping:
    topics:
      - /tf
      - /tf_static
      - /scan_filtered
    split: 600
    max_gb: 4.0

  lite:
    topics:
      - /tf
      - /tf_static
      - /scan_filtered
      - /diff_drive_controller/cmd_vel
      - /diff_drive_controller/odom
      - /goal_pose
      - /plan
      - /task/command
      - /task/status
      - /diagnostics
    split: 600 # seconds per bag segment
    max_gb: 2.0 # rolling disk cap

  perception:
    topics:
      - /tf
      - /tf_static
      - /scan_filtered
      - /image_raw/compressed
      - /camera_info
    split: 60
    max_gb: 10.0
