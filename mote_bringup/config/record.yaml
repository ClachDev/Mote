# Rosbag recording streams — consumed by record_launch.py.
# Each stream writes to ~/.mote/bags/<name>/<timestamp>/ with its own segment
# length and rolling disk cap (enforced by bag_pruner).

streams:
  # Recorded during mapping sessions so save-map can stamp the bag into the
  # map revision's meta.yaml. Enough to re-run SLAM offline.
  mapping:
    topics:
      - /tf
      - /tf_static
      - /scan_filtered
      # Both are tiny beside the scans, and both are what slip_replay.py needs to
      # re-score a session offline: the command separates a stuck robot from a
      # parked one, and the residual records what the robot itself concluded.
      - /diff_drive_controller/cmd_vel
      - /slip/residual
    split: 600
    max_gb: 4.0

  lite:
    topics:
      - /tf
      - /tf_static
      - /scan_filtered
      # The drive mux's output plus both its inputs: the output alone cannot
      # say which source was driving, and after a takeover that is the question.
      - /diff_drive_controller/cmd_vel
      - /cmd_vel_nav
      - /cmd_vel_teleop_stamped
      - /diff_drive_controller/odom
      - /goal_pose
      # RViz's Nav2 Goal tool sends the goal over the navigate_to_pose action,
      # not /goal_pose. The goal request itself is a service (unrecordable), but
      # these two topics capture the goal lifecycle — status carries the
      # accepted/succeeded/aborted transitions, feedback the live progress.
      - /navigate_to_pose/_action/status
      - /navigate_to_pose/_action/feedback
      - /plan
      - /task/command
      - /task/status
      - /diagnostics
    split: 600 # seconds per bag segment
    max_gb: 2.0 # rolling disk cap

  perception:
    topics:
      - /tf
      - /tf_static
      - /scan_filtered
      - /image_raw/compressed
      - /camera_info
    split: 60
    max_gb: 10.0
