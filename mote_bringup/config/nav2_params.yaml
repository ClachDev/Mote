bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /kinematic_icp/lidar_odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /diff_drive_controller/odom
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    enable_stamped_cmd_vel: true

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      angular_dist_threshold: 1.22
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 1.5
      max_angular_accel: 1.5
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      rotate_to_heading_once: false
      primary_controller: "dwb_core::DWBLocalPlanner"
      publish_evaluation: true
      publish_global_plan: true
      publish_transformed: true
      publish_local_plan: true
      publish_trajectories: true
      publish_cost_grid_pc: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.3
      max_vel_y: 0.0
      max_vel_theta: 1.5
      min_speed_xy: 0.0
      max_speed_xy: 0.3
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.1
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["WheelSpeedLimit", "RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      WheelSpeedLimit.class: "mote_nav::WheelSpeedLimitCritic"
      # max_wheel_speed and wheel_separation are injected from robot.yaml by
      # nav2_launch.py so the hardware envelope has one source of truth.
      WheelSpeedLimit.scale: 1.0
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.12
      plugins: ["obstacle_layer", "camera_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      # Monocular-depth obstacles (mote_perception/depth_obstacle_node): the low,
      # near things the single lidar plane misses (cables, thresholds, chair and
      # table legs, a clothes-horse cross-bar). A separate layer, kept off the global
      # costmap: near-band, reactive, and never allowed to clear the lidar layer --
      # combination_method 1 takes the max, so free space here cannot erase a lidar
      # mark.
      #
      # It is a spatio_temporal_voxel_layer rather than nav2_costmap_2d::VoxelLayer
      # because a voxel layer can only clear by raytracing towards a point in a later
      # observation, and this cloud carries ONLY above-floor points -- the node strips
      # the floor to keep the stream off the Wi-Fi. Someone who walks through the band
      # and leaves takes their points with them, so nothing is ever observed in that
      # direction again, no clearing ray crosses the marks they left, and the marks
      # stay for good: `clearing` on the source was inert over open floor. STVL expires
      # a voxel on a clock instead, voxel_decay seconds after the last time it was
      # marked, whatever the viewing geometry. An obstacle that stays in view is
      # re-marked every frame and so never expires; one that leaves, or one the robot
      # turns away from, goes on its own.
      camera_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        # How long a mark outlives its last observation, and the one trade-off in this
        # layer: too short and the robot forgets a low obstacle while steering round it
        # (the camera loses it below range_min 0.25 m, about a second before the wheels
        # reach it); too long and a transient lingers, which is the whole complaint.
        # 5 s is ~1 m of travel at the 0.22 m/s wheel limit.
        voxel_decay: 5.0
        decay_model: 0  # 0 = linear, 1 = exponential, -1 = persistent
        # One cube edge for all three axes, where VoxelLayer had a separate z_resolution
        # (this is that z_resolution). Finer than the costmap's 0.05 m cells; the grid is
        # a sparse OpenVDB tree, so the cost is per observed point, not per volume.
        voxel_size: 0.025
        # Voxels stacked in one column before it marks the cell lethal.
        mark_threshold: 0
        combination_method: 1
        update_footprint_enabled: True
        # Never write NO_INFORMATION into the local costmap: this layer is additive over
        # the lidar's and knows nothing about space it has not looked at.
        track_unknown_space: False
        publish_voxel_map: False
        observation_sources: camera
        camera:
          topic: /camera_obstacles
          data_type: "PointCloud2"
          # The cloud carries leveled base_footprint coords; sensor_frame names the real
          # camera, which is where the frustum would be anchored if clearing were on.
          sensor_frame: camera_optical_link
          marking: True
          # Frustum clearing stays off. Decay already answers the stale-mark case, and a
          # mis-stated FOV would clear real obstacles that the lidar plane cannot see --
          # the failure mode is worse than the one it fixes. To enable it: clearing True
          # plus min_z/max_z, vertical_fov_angle, horizontal_fov_angle and a non-zero
          # decay_acceleration, all describing the camera in sensor_frame.
          clearing: False
          # LOAD-BEARING. The buffer holds its newest cloud until something empties it,
          # and every costmap update re-marks whatever it reads -- marking stamps each
          # voxel with the current time, which restarts its decay. Without this the
          # cloud of a departed obstacle is re-marked at 5 Hz forever, voxel_decay never
          # fires, and the layer reproduces exactly the bug it was swapped in to fix.
          clear_after_reading: True
          # Keep only the newest cloud in the buffer.
          observation_persistence: 0.0
          # The two height bounds below are applied AS this filter's z limits, so
          # `none` would silently drop the go-under gate rather than just the filtering.
          filter: "passthrough"
          min_obstacle_height: 0.02
          # Go-under gate: anything whose lowest point clears this height is passable
          # overhead the robot drives under (a chair seat, a tabletop) and must not
          # mark. Because this is a 3D voxel layer, the legs of that furniture (which
          # reach the floor) still mark, so the robot avoids the legs but paths
          # through the gap beneath. Set to the robot's height + a margin: 0.18 m for
          # the current ~0.13 m chassis (no arm). WITH THE ARM the robot is ~0.30 m --
          # raise this to ~0.35 m; unlike VoxelLayer there is no separate grid ceiling
          # to raise with it. The go-under benefit shrinks at that height (a 0.30 m
          # robot no longer fits under most chair seats).
          max_obstacle_height: 0.18
          obstacle_range: 1.2
          expected_update_rate: 0.0
          inf_is_valid: False
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.12
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.125
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 5.0
      use_astar: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.5
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.5
    enable_stamped_cmd_vel: true

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

amcl:
  ros__parameters:
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan_filtered
    robot_model_type: nav2_amcl::DifferentialMotionModel
    # Odometry noise model
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    # Laser model
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.1
    max_beams: 60
    # Particle filter
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.25
    update_min_a: 0.2
    # Pose recovery
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    transform_tolerance: 1.0
    tf_broadcast: true
    save_pose_rate: 0.5
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
