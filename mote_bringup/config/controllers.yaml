controller_manager:
  ros__parameters:
    update_rate: 50

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # The SO-101 arm. Loaded but spawned *inactive* (see launch_utils): claiming
    # the position command interfaces is what enables servo torque, so the arm
    # is back-drivable until something explicitly asks it to hold.
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

diff_drive_controller:
  ros__parameters:
    # wheel_separation and wheel_radius come from mote_description/config/robot.yaml,
    # injected at launch by mote_launch.py
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    linear:
      x:
        max_velocity: 0.3
        max_acceleration: 1.0
        max_deceleration: -1.0
    angular:
      z:
        max_velocity: 1.87
        max_acceleration: 5.0
        max_deceleration: -5.0

    # The deadman for remote teleop, pinned rather than left to the default: the
    # wheels halt this long after the last command, so an operator whose link
    # drops mid-drive stops on the robot's own clock instead of running on. A
    # teleop source must publish faster than this or the robot stutters between
    # commands — the shipped Foxglove layout uses 10 Hz.
    cmd_vel_timeout: 0.5

    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: false       # odom->base is owned by kinematic_icp; wheel
                                # odom reaches it via the odom_tf_relay leaf

    # Covariance for a 2D robot — z/roll/pitch are constrained
    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

arm_controller:
  ros__parameters:
    # `joints` comes from mote_description/config/robot.yaml (arm.joints),
    # injected at launch by mote_launch.py — the same treatment the wheel
    # geometry gets, so robot.yaml stays the single source of truth.
    command_interfaces: ["position"]
    state_interfaces: ["position"]

    # The servos close their own position loop, and MoteHardware reads arm
    # state one joint per cycle (~8 Hz per joint) to stay inside the bus budget
    # it shares with the wheels. Generating the trajectory from the last
    # commanded point rather than from that deliberately-lagging state is what
    # keeps the two consistent.
    open_loop_control: true

    # Jog moves one joint at a time; the rest hold where they are.
    allow_partial_joints_goal: true

    # No tolerance checking: the authoritative limits are the per-joint soft
    # limits enforced in the hardware, and a goal-time check against 8 Hz
    # feedback would fail trajectories that in fact completed.
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
