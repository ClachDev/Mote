controller_manager:
  ros__parameters:
    update_rate: 50

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_drive_controller:
  ros__parameters:
    # wheel_separation and wheel_radius come from mote_description/config/robot.yaml,
    # injected at launch by mote_launch.py
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    linear:
      x:
        max_velocity: 0.3
        max_acceleration: 1.0
        max_deceleration: -1.0
    angular:
      z:
        max_velocity: 1.87
        max_acceleration: 5.0
        max_deceleration: -5.0

    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true        # kinematic-icp reads this raw wheel odom TF

    # Covariance for a 2D robot — z/roll/pitch are constrained
    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
