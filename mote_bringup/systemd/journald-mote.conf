# Mote journald sizing — installed to /etc/systemd/journald.conf.d/ by
# systemd/install.sh. Keeps persistent logs (so post-mortems survive a reboot)
# but bounds them so the always-restarting services can never fill the SD card.
[Journal]
Storage=persistent
SystemMaxUse=500M
SystemKeepFree=1G
MaxRetentionSec=2week
# Rate-limit a crash-looping service so a tight restart loop cannot drown the
# journal (0 disables the burst cap; here we allow bursts but bound them).
RateLimitIntervalSec=30s
RateLimitBurst=10000
