# Let the Broadcom firmware take the roam decision.
# Installed to /etc/modprobe.d/zz-mote-brcmfmac.conf by: pixi run wifi-roaming
#
# roamoff=0 is brcmfmac's own default. Raspberry Pi OS overrides it in
# /usr/lib/modprobe.d/rpi-brcmfmac.conf, and with the firmware engine off
# nothing on this card roams at all: no userspace backend can take the decision
# over. README.md has the two source paths that make that so.
#
# THE FILE NAME IS LOAD-BEARING. modprobe concatenates the `options` lines from
# every config file, sorted by base name across all of its directories, and the
# kernel applies duplicate parameters left to right, so the last one wins. The
# vendor's file is `rpi-brcmfmac.conf`; a name sorting before it (`99-...`) is
# read first and then overridden, whichever directory it sits in. Check with
# `modprobe -c | grep brcmfmac`: this line must be the last one.
#
# feature_disable is the vendor's and is deliberately not repeated here. An
# `options` line adds to the command line rather than replacing it, so every
# parameter this file does not name keeps the value the vendor gave it.
#
# Module parameters are read when the module loads, so this takes effect at the
# next reboot. brcmfmac is not in the initramfs (MODULES=dep, and the SDIO card
# is not needed to mount root), so no initramfs rebuild is involved.
#
# Verify with: pixi run wifi-check
options brcmfmac roamoff=0
