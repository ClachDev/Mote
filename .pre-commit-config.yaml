# Fast pre-commit checks. Run on commit after `pixi run lint-install`, or
# manually across the tree with `pixi run lint`. Hygiene fixes, shell linting,
# and Python error-checking only.
# Skip submodules and the binary/CAD/image assets (text hooks must not rewrite
# ASCII STEP files).
exclude: |
  (?x)^(
    third_party/|
    design/|
    docs/images/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
        args: [--maxkb=2048]  # above pixi.lock (~1.7 MB)

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff-check
      - id: ruff-format

  # The docs CI job, run locally: a page missing from mkdocs.yml's nav or a
  # link mkdocs cannot resolve fails `--strict`. The site mounts markdown from
  # across the repo (docs/hooks/repo_links.py), so any .md can break it.
  # The docs env comes from the main checkout's manifest, so a commit in a git
  # worktree does not install a second env; the site goes to a temp dir.
  - repo: local
    hooks:
      - id: mkdocs-strict
        name: mkdocs build --strict
        language: system
        entry: >-
          bash -c 'root=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)");
          out=$(mktemp -d); trap "rm -rf \"$out\"" EXIT;
          pixi run --frozen --manifest-path "$root/pixi.toml" -e docs
          mkdocs build --strict -f "$PWD/mkdocs.yml" -d "$out"'
        files: (\.md$|^mkdocs\.yml$|^docs/)
        pass_filenames: false
