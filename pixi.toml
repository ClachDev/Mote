[workspace]
authors = ["Michael Johnson <michael@clach.dev>"]
channels = ["https://prefix.dev/mote", "robostack-jazzy", "conda-forge"]
name = "mote"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
submodules = "git submodule update --init"
build = { cmd = "colcon build --symlink-install --cmake-args -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5", depends-on = [
    "submodules",
] }
test = { cmd = "colcon test --packages-select mote_hardware mote_bringup mote_tasks --event-handlers console_direct+ && colcon test-result --verbose", depends-on = [
    "build",
] }

# Pi Setup tasks
setup-ids = "ros2 run mote_hardware setup_ids"
udev = "sudo cp mote_bringup/udev/99-mote.rules /etc/udev/rules.d/ && sudo udevadm control --reload-rules && sudo udevadm trigger && sudo usermod -aG dialout $USER"
wifi-powersave = "bash mote_bringup/networkmanager/install.sh"
install-systemd = "bash mote_bringup/systemd/install.sh"
setup = { depends-on = ["udev", "wifi-powersave", "install-systemd"] }

# Dev tasks
kill = "pkill -9 -f 'robot_state_publisher|ros2_control_node|sllidar|v4l2_camera|spawner'; ros2 daemon stop; rm -f /dev/shm/fast*; ros2 daemon start; true"
sync = "rsync -avz --exclude='.pixi/' --exclude='build/' --exclude='install/' --exclude='log/' --exclude='.git/' --exclude='.claude/' --exclude='mote_simulation/' --exclude='__pycache__/' . michael@auldbot:~/Mote/"
save-map = "ros2 run mote_bringup site save-map"
clean-map = "PYTHONPATH=mote_bringup python -m mote_bringup.map_cleanup.cli"
save-zone = "ros2 run mote_tasks save_zone"
site = "ros2 run mote_bringup site"

# Quick launch commands
launch = "ros2 launch mote_bringup mote_launch.py"
mapping = "ros2 launch mote_bringup mapping_launch.py"
nav = "ros2 launch mote_bringup nav2_launch.py"
robot = "ros2 launch mote_bringup robot_launch.py"
slam = "ros2 launch mote_bringup slam_launch.py"
teleop = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p stamped:=true -r /cmd_vel:=/diff_drive_controller/cmd_vel"
perception = "ros2 launch mote_perception perception_launch.py"
record = "ros2 launch mote_bringup record_launch.py"
depth = "bash mote_perception/tools/depth_workstation.sh"
# GPU (AMD ROCm) variant of `depth`; falls back to CPU if no usable GPU is found.
depth-rocm = "bash mote_perception/tools/depth_workstation.sh rocm"
tasks = "ros2 launch mote_tasks tasks_launch.py"

#### The below tasks are tied to specific features and environments however they
#### can be run like any other task.

[feature.dev.tasks]
rviz = "ros2 launch mote_bringup rviz_launch.py"
camera_calibration = "ros2 run camera_calibration cameracalibrator --size 6x9 --square 0.025 --ros-args -r image:=/image_raw -p camera:=/camera -p image_transport:=compressed"

# Continuously rsync to the Pi on save (watchexec honours .gitignore, so
# build/install/log/.pixi are skipped). Edits to launch/config/Python go live
# without a rebuild thanks to colcon --symlink-install; only C++ needs `build`.
sync-watch = "watchexec --debounce 1s -- pixi run sync"

# Sim sites (maps + zones) are committed under mote_simulation/sim_home and
# selected via MOTE_HOME, so sim-nav loads a world's own map and never touches
# the robot's real ~/.mote. sim_launch resolves the map from the world arg.
[feature.sim.activation.env]
MOTE_HOME = "$PIXI_PROJECT_ROOT/mote_simulation/sim_home"

[feature.sim.tasks]
sim = "ros2 launch mote_simulation sim_launch.py"
sim-mapping = "ros2 launch mote_simulation sim_launch.py mode:=mapping"
sim-nav = "ros2 launch mote_simulation sim_launch.py mode:=nav"
# Build/refresh a world's committed site by mapping it with SLAM (see the tool).
sim-map-world = "bash mote_simulation/tools/map_world.sh"
sim-test = { cmd = "bash mote_simulation/test/sim_smoke/run_sim_smoke.sh", depends-on = [
    "build",
] }

[feature.lint.tasks]
lint = "pre-commit run --all-files"
# One-time per clone: wire pre-commit into .git/hooks so it runs on commit
lint-install = "pre-commit install"

[dependencies]
cmake = ">=4.3.2,<5"
colcon-common-extensions = ">=0.3.0,<0.4"
compilers = ">=1.11.0,<2"
filelock = ">=3.12.2"
libcap = ">=2.77,<3"
lttng-ust = ">=2.13.9,<3"
ninja = ">=1.13.2,<2"
pkg-config = ">=0.29.2,<0.30"
ros-jazzy-ament-cmake-auto = ">=2.5.5,<3"
ros-jazzy-ament-lint-auto = ">=0.17.4,<0.18"
ros-jazzy-image-transport-plugins = ">=3.0.0"
ros-jazzy-laser-filters = ">=2.0.0"
ros-jazzy-nav2-amcl = ">=1.3.0"
ros-jazzy-nav2-behaviors = ">=1.3.0"
ros-jazzy-nav2-bt-navigator = ">=1.3.0"
ros-jazzy-nav2-controller = ">=1.3.0"
ros-jazzy-nav2-costmap-2d = ">=1.3.0"
ros-jazzy-nav2-dwb-controller = ">=1.3.0"
ros-jazzy-nav2-lifecycle-manager = ">=1.3.0"
ros-jazzy-nav2-map-server = ">=1.3.0"
ros-jazzy-nav2-mppi-controller = ">=1.3.0"
ros-jazzy-nav2-navfn-planner = ">=1.3.0"
ros-jazzy-nav2-planner = ">=1.3.0"
ros-jazzy-nav2-regulated-pure-pursuit-controller = ">=1.3.0"
ros-jazzy-nav2-rotation-shim-controller = ">=1.3.0"
ros-jazzy-nav2-smac-planner = ">=1.3.0"
ros-jazzy-nav2-smoother = ">=1.3.0"
ros-jazzy-nav2-waypoint-follower = ">=1.3.0"
ros-jazzy-rmw-cyclonedds-cpp = ">=1.3.0"
ros-jazzy-robot-state-publisher = ">=3.0.0"
ros-jazzy-ros2-control = ">=4.43.0,<5"
ros-jazzy-ros2-controllers = ">=4.37.0,<5"
ros-jazzy-ros2launch = ">=0.11.0"
ros-jazzy-ros2lifecycle = ">=0.18.0"
ros-jazzy-ros2run = ">=0.18.0"
ros-jazzy-rosbag2-cpp = ">=0.26.0"
ros-jazzy-rosbag2-storage = ">=0.26.0"
# `ros2 bag record` CLI verb, recorder, and storage plugins (pixi run record)
ros-jazzy-ros2bag = ">=0.26.0"
ros-jazzy-rosbag2-transport = ">=0.26.0"
ros-jazzy-rosbag2-storage-mcap = ">=0.26.0"
ros-jazzy-slam-toolbox = ">=2.8.4,<3"
ros-jazzy-teleop-twist-keyboard = ">=1.0.0"
ros-jazzy-v4l2-camera = ">=0.7.1,<0.8"
ros-jazzy-xacro = ">=2.0.0"
scservo-linux = "==1.0.0"
ros-jazzy-ament-cmake-gtest = ">=2.5"

# Pure-Python behaviour-tree library for mote_tasks; not packaged on
# robostack/conda-forge, so it comes from PyPI.
[pypi-dependencies]
py-trees = ">=2.2,<3"

[feature.dev.dependencies]
ros-jazzy-desktop = ">=0.11.0"
ros-jazzy-nav2-bringup = ">=1.3.11,<2"
# RViz display for AMCL's /particle_cloud (nav2_msgs/ParticleCloud); the stock
# rviz_default_plugins only ships a PoseArray display, which mistypes the topic.
ros-jazzy-nav2-rviz-plugins = ">=1.3.0"
# Interactive camera calibration GUI — run on the workstation against the Pi's
# camera topics; the robot env stays lean. semver is an undeclared runtime
# dependency of the conda camera_calibration package, so it is pinned here.
ros-jazzy-camera-calibration = "*"
semver = ">=3,<4"
watchexec = ">=2.5,<3"

# Desktop-only GUI teleop panel (ClachDev/rviz_teleop_panel), published to the
# mote channel for linux-64 only — the aarch64 robot never runs RViz.
[feature.dev.target.linux-64.dependencies]
ros-jazzy-rviz-teleop-panel = ">=0.1.0"


[feature.sim.dependencies]
ros-jazzy-ros-gz-sim = "*"
ros-jazzy-ros-gz-bridge = "*"
ros-jazzy-gz-ros2-control = "*"

[feature.depth.dependencies]
numpy = ">=1.26,<3"
pillow = ">=10,<13"
pytorch = ">=2,<3"
transformers = ">=4,<5"

[feature.depth.tasks]
depth-server = "python mote_perception/tools/depth_server.py"

# GPU-accelerated sibling of the `depth` feature (env `depth-rocm`). Same server,
# but torch comes from the pytorch.org ROCm wheel index instead of conda-forge so
# inference can run on an AMD GPU. Kept a separate env so the CPU `depth` env, the
# robot/Pi default env, and their solves are untouched. The ROCm wheels bundle
# their own userspace (no system ROCm needed) and only publish cp3.x up to 3.12,
# so python is pinned here (the CPU depth env floats to 3.14). numpy/pillow stay
# on conda; only torch + transformers come from PyPI so pip resolves torch against
# the ROCm index rather than pulling conda's CPU pytorch. x86_64-only: the wheels
# have no aarch64 build and the aarch64 robot never runs this workstation feature.
[feature.depth-rocm]
platforms = ["linux-64"]

[feature.depth-rocm.dependencies]
python = "3.12.*"
numpy = ">=1.26,<3"
pillow = ">=10,<13"

[feature.depth-rocm.pypi-dependencies]
torch = { version = ">=2.8,<3", index = "https://download.pytorch.org/whl/rocm6.4" }
pytorch-triton-rocm = { version = "*", index = "https://download.pytorch.org/whl/rocm6.4" }
transformers = ">=4,<5"

# gfx1103 (Phoenix3 RDNA3 iGPU) is not an officially supported ROCm target; the
# standard workaround is to masquerade as gfx1100. Set here so it applies to every
# `pixi run -e depth-rocm` invocation without manual exporting.
[feature.depth-rocm.activation.env]
HSA_OVERRIDE_GFX_VERSION = "11.0.0"

# Distinct name from the CPU `depth-server` task so `pixi run depth-server` stays
# unambiguous (CPU); the GPU server is `pixi run depth-server-rocm`.
[feature.depth-rocm.tasks]
depth-server-rocm = "python mote_perception/tools/depth_server.py"

[feature.lint.dependencies]
pre-commit = ">=4,<5"

[activation]
scripts = ["install/setup.sh"]
env = { RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp" }

[environments]
dev = { features = ["dev"], solve-group = "default" }
# Own solve (no solve-group) so sim deps can never shift the robot/Pi env
sim = { features = ["sim"] }
depth = { features = ["depth"], no-default-feature = true }
depth-rocm = { features = ["depth-rocm"], no-default-feature = true }
# ^ GPU sibling of `depth`; own solve (no solve-group) so the ROCm torch wheel can
# never perturb any other env.
# Minimal env (no ROS) so 'pixi run lint' is fast to solve and install
lint = { features = ["lint"], no-default-feature = true }
