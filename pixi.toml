[workspace]
authors = ["Michael Johnson <michael@clach.dev>"]
channels = ["https://prefix.dev/mote", "robostack-jazzy", "conda-forge"]
name = "mote"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
submodules = "git submodule update --init"
build = { cmd = "colcon build --symlink-install --cmake-args -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5", depends-on = [
    "submodules",
] }
test = { cmd = "colcon test --packages-select mote_hardware mote_bringup mote_nav mote_perception mote_tasks mote_arm mote_fleet --event-handlers console_direct+ && colcon test-result --verbose", depends-on = [
    "build",
] }

# Pi Setup tasks
setup-ids = "ros2 run mote_hardware setup_ids"
# SO-101 follower arm bring-up (see mote_arm/README.md, mote_arm/BENCH.md).
arm-check = "ros2 run mote_arm arm_check"
udev = "sudo cp mote_bringup/udev/99-mote.rules /etc/udev/rules.d/ && sudo udevadm control --reload-rules && sudo udevadm trigger && sudo usermod -aG dialout $USER"
wifi-powersave = "bash mote_bringup/networkmanager/install.sh"
install-systemd = "bash mote_bringup/systemd/install.sh"
setup = { depends-on = ["udev", "wifi-powersave", "install-systemd"] }

# Fleet: overlay + identity (docs/fleet/README.md)
identity = "ros2 run mote_bringup identity"      # this robot's id/name/site
tailnet = "bash mote_bringup/tailscale/install.sh"  # join the Tailscale overlay
provision = "ros2 run mote_bringup provision"    # render cloud-init for a new Pi
dds-check = "ros2 run mote_bringup dds_participants"  # participant-slot headroom

# Fleet control plane (docs/fleet/control-plane.md). The agent and enroll run on
# the robot; the server and fleetctl are off-board but ROS-free, so they run in
# any environment — the dedicated `fleet` env below is the deployable role, and
# it is the only one that carries the broker.
agent = "ros2 launch mote_fleet agent_launch.py"   # robot -> fleet bridge
enroll = "ros2 run mote_fleet enroll"              # ask the server for an id
fleet-server = "python -u mote_fleet/server/fleet_server.py"  # API + dashboard
fleetctl = "python -u mote_fleet/server/fleetctl.py"          # operator CLI
# The dashboard's read path is MQTT-over-WebSockets, which conda-forge's
# mosquitto is not built for (docs/fleet/m1-verification.md §4) — so the broker
# that serves a browser is a container one. No pixi environment needed, hence
# its place here rather than in [feature.fleet.tasks].
fleet-broker-ws = "bash mote_fleet/server/broker.sh --docker"

# Dev tasks
kill = "pkill -9 -f 'robot_state_publisher|ros2_control_node|sllidar|v4l2_camera|spawner'; ros2 daemon stop; rm -f /dev/shm/fast*; ros2 daemon start; true"
# '.git' has no trailing slash on purpose: a submodule's .git is a *file*
# holding a path into this checkout's .git/modules, and '.git/' (directory-only)
# would ship it to the robot and break the robot's submodule refs.
sync = "rsync -avz --exclude='.pixi/' --exclude='build/' --exclude='install/' --exclude='log/' --exclude='.git' --exclude='.claude/' --exclude='mote_simulation/' --exclude='__pycache__/' . michael@auldbot:~/Mote/"
save-map = "ros2 run mote_bringup site save-map"
clean-map = "PYTHONPATH=mote_bringup python -m mote_bringup.map_cleanup.cli"
save-zone = "ros2 run mote_tasks save_zone"
site = "ros2 run mote_bringup site"

# Replay a recorded real-robot mapping bag through SLAM (or kinematic_icp) under
# N parameter sets and score them with truth-free proxies -> comparison report
# (metrics table + rendered maps). The reality check that complements `bench`
# (which needs Gazebo ground truth). Needs no sim/gz. Example:
#   pixi run bag-replay -- --bag ~/.mote/bags/mapping/<ts> --params a.yaml b.yaml
bag-replay = "python mote_simulation/tools/bag_replay/replay.py"

# Quick launch commands
launch = "ros2 launch mote_bringup mote_launch.py"
mapping = "ros2 launch mote_bringup mapping_launch.py"
nav = "ros2 launch mote_bringup nav2_launch.py"
robot = "ros2 launch mote_bringup robot_launch.py"
slam = "ros2 launch mote_bringup slam_launch.py"
teleop = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p stamped:=true -r /cmd_vel:=/diff_drive_controller/cmd_vel"
perception = "ros2 launch mote_perception perception_launch.py"
# Remote observability + teleop (docs/fleet/README.md §10). Included in the base
# by default, so this is for running it on its own — or under systemd, where
# mote-foxglove.service keeps it up across a bringup restart.
foxglove = "ros2 launch mote_bringup foxglove_launch.py"
record = "ros2 launch mote_bringup record_launch.py"
tasks = "ros2 launch mote_tasks tasks_launch.py"
health = "ros2 run mote_bringup health_monitor"
self-check = "ros2 run mote_bringup self_check"
chaos = "bash mote_bringup/test/chaos/chaos_restart.sh"
# SO-101 arm driver (joint states + safe jog target control); run alongside a
# mission like perception. Jog it interactively with `pixi run arm-jog`.
arm = "ros2 launch mote_arm arm_launch.py"
arm-jog = "ros2 run mote_arm jog"
# Teach/replay named arm poses (save is read-only; go asks before moving).
arm-pose = "ros2 run mote_arm arm_pose"
# Show/apply the arm servos' position-loop gains from robot.yaml (EEPROM).
arm-gains = "ros2 run mote_arm arm_gains"
# Robot-side inference diagnostics (torch-free — run in the default/robot env):
# probe the inference machine's health/version, or benchmark round-trip latency.
inference-health = "python -u mote_perception/tools/inference_health.py"
inference-bench = "python -u mote_perception/tools/inference_bench.py"

#### The below tasks are tied to specific features and environments however they
#### can be run like any other task.

[feature.dev.tasks]
rviz = "ros2 launch mote_bringup rviz_launch.py"
# Same RViz, but joined to the sim's host-local DDS graph (the sim pins
# discovery to LOCALHOST; a default-range RViz cannot see it). Use `rviz` for
# the robot, `rviz-sim` for a sim running on this machine.
rviz-sim = { cmd = "ros2 launch mote_bringup rviz_launch.py", env = { ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST" } }
camera_calibration = "ros2 run camera_calibration cameracalibrator --size 6x9 --square 0.025 --ros-args -r image:=/image_raw -p camera:=/camera -p image_transport:=compressed"

# Continuously rsync to the Pi on save (watchexec honours .gitignore, so
# build/install/log/.pixi are skipped). Edits to launch/config/Python go live
# without a rebuild thanks to colcon --symlink-install; only C++ needs `build`.
sync-watch = "watchexec --debounce 1s -- pixi run sync"

# Sim sites (maps + zones) are committed under mote_simulation/sim_home and
# selected via MOTE_HOME, so sim-nav loads a world's own map and never touches
# the robot's real ~/.mote. sim_launch resolves the map from the world arg.
[feature.sim.activation.env]
MOTE_HOME = "$PIXI_PROJECT_ROOT/mote_simulation/sim_home"
# Confine DDS discovery to this machine for every sim/benchmark process, so a
# run neither advertises itself to nor discovers a robot or another workstation
# on the LAN. Same-host tooling still works: a LOCALHOST participant discovers
# same-host SUBNET ones. The reverse does not hold, so a default-range tool
# cannot see the sim — hence `rviz-sim` below. To deliberately expose a sim run
# (e.g. viewing it from another machine): pixi run -e sim -- env
# ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET ros2 launch mote_simulation sim_launch.py
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"

[feature.sim.tasks]
sim = "ros2 launch mote_simulation sim_launch.py"
sim-mapping = "ros2 launch mote_simulation sim_launch.py mode:=mapping"
sim-nav = "ros2 launch mote_simulation sim_launch.py mode:=nav"
# Build/refresh a world's committed site by mapping it with SLAM (see the tool).
sim-map-world = "bash mote_simulation/tools/map_world.sh"
# Benchmark the nav mission against Gazebo ground truth -> metrics JSON + report.
# Args pass through, e.g. `pixi run bench -- --worlds mote_world.sdf --trials 3`.
bench = "python mote_simulation/tools/benchmark/bench.py"
# Parameter sweep on top of bench: run the benchmark per parameter set, rank
# against the baseline, emit a ranking + provenance report. Sequential (one gz
# instance). `pixi run bench-sweep <spec.yaml>`; `-- --dry-run` prints the plan.
bench-sweep = "python mote_simulation/tools/benchmark/sweep/sweep.py"
sim-test = { cmd = "bash mote_simulation/test/sim_smoke/run_sim_smoke.sh", depends-on = [
    "build",
] }

[feature.lint.tasks]
lint = "pre-commit run --all-files"
# One-time per clone: wire pre-commit into .git/hooks so it runs on commit
lint-install = "pre-commit install"

[dependencies]
cmake = ">=4.3.2,<5"
colcon-common-extensions = ">=0.3.0,<0.4"
compilers = ">=1.11.0,<2"
filelock = ">=3.12.2"
libcap = ">=2.77,<3"
lttng-ust = ">=2.13.9,<3"
ninja = ">=1.13.2,<2"
pkg-config = ">=0.29.2,<0.30"
ros-jazzy-ament-cmake-auto = ">=2.5.5,<3"
ros-jazzy-ament-lint-auto = ">=0.17.4,<0.18"
ros-jazzy-image-transport-plugins = ">=3.0.0"
ros-jazzy-laser-filters = ">=2.0.0"
ros-jazzy-nav2-amcl = ">=1.3.0"
ros-jazzy-nav2-behaviors = ">=1.3.0"
ros-jazzy-nav2-bt-navigator = ">=1.3.0"
ros-jazzy-nav2-controller = ">=1.3.0"
ros-jazzy-nav2-costmap-2d = ">=1.3.0"
ros-jazzy-nav2-dwb-controller = ">=1.3.0"
ros-jazzy-nav2-lifecycle-manager = ">=1.3.0"
ros-jazzy-nav2-map-server = ">=1.3.0"
ros-jazzy-nav2-mppi-controller = ">=1.3.0"
ros-jazzy-nav2-navfn-planner = ">=1.3.0"
ros-jazzy-nav2-planner = ">=1.3.0"
ros-jazzy-nav2-regulated-pure-pursuit-controller = ">=1.3.0"
ros-jazzy-nav2-rotation-shim-controller = ">=1.3.0"
ros-jazzy-nav2-smac-planner = ">=1.3.0"
ros-jazzy-nav2-smoother = ">=1.3.0"
ros-jazzy-nav2-waypoint-follower = ">=1.3.0"
ros-jazzy-rmw-cyclonedds-cpp = ">=1.3.0"
ros-jazzy-robot-state-publisher = ">=3.0.0"
ros-jazzy-ros2-control = ">=4.43.0,<5"
ros-jazzy-ros2-controllers = ">=4.37.0,<5"
ros-jazzy-ros2launch = ">=0.11.0"
ros-jazzy-ros2lifecycle = ">=0.18.0"
ros-jazzy-ros2run = ">=0.18.0"
ros-jazzy-rosbag2-cpp = ">=0.26.0"
ros-jazzy-rosbag2-storage = ">=0.26.0"
# `ros2 bag record` CLI verb, recorder, and storage plugins (pixi run record)
ros-jazzy-ros2bag = ">=0.26.0"
ros-jazzy-rosbag2-transport = ">=0.26.0"
ros-jazzy-rosbag2-storage-mcap = ">=0.26.0"
ros-jazzy-slam-toolbox = ">=2.8.4,<3"
ros-jazzy-teleop-twist-keyboard = ">=1.0.0"
# The robot's off-box observability path (docs/fleet/README.md §10): the operator's
# Foxglove connects to this over the tailnet, so it runs on the robot alongside
# the mission rather than on the workstation.
ros-jazzy-foxglove-bridge = ">=3.3.0,<4"
ros-jazzy-v4l2-camera = ">=0.7.1,<0.8"
ros-jazzy-vision-msgs = ">=4.1.0"
ros-jazzy-xacro = ">=2.0.0"
scservo-linux = "==1.0.0"
ros-jazzy-ament-cmake-gtest = ">=2.5"
# MQTT client for the fleet agent (mote_fleet). On the robot because the agent
# runs there; the broker itself is a fleet-server dependency, not a robot one.
paho-mqtt = ">=2,<3"

# Pure-Python behaviour-tree library for mote_tasks; not packaged on
# robostack/conda-forge, so it comes from PyPI.
[pypi-dependencies]
py-trees = ">=2.2,<3"
# Feetech STS servo SDK (imports as scservo_sdk) for the SO-101 arm bus in
# mote_arm; pure-Python, not packaged on robostack/conda-forge. Same servo
# family as the drive wheels (mote_hardware uses the vendored C++ SDK).
feetech-servo-sdk = ">=1.0"

[feature.dev.dependencies]
ros-jazzy-desktop = ">=0.11.0"
ros-jazzy-nav2-bringup = ">=1.3.11,<2"
# RViz display for AMCL's /particle_cloud (nav2_msgs/ParticleCloud); the stock
# rviz_default_plugins only ships a PoseArray display, which mistypes the topic.
ros-jazzy-nav2-rviz-plugins = ">=1.3.0"
# Interactive camera calibration GUI — run on the workstation against the Pi's
# camera topics; the robot env stays lean. semver is an undeclared runtime
# dependency of the conda camera_calibration package, so it is pinned here.
ros-jazzy-camera-calibration = "*"
semver = ">=3,<4"
watchexec = ">=2.5,<3"
# Speaks the Foxglove WebSocket protocol in test_foxglove_teleop.py, which drives
# the real bridge the way the Teleop panel does. Test-only, and dev-only for the
# same reason the real-broker fleet test is: the robot env carries no test rig.
websockets = ">=12,<16"

# Desktop-only GUI teleop panel (ClachDev/rviz_teleop_panel), published to the
# mote channel for linux-64 only — the aarch64 robot never runs RViz.
[feature.dev.target.linux-64.dependencies]
ros-jazzy-rviz-teleop-panel = ">=0.1.0"

[feature.sim.dependencies]
ros-jazzy-ros-gz-sim = "*"
ros-jazzy-ros-gz-bridge = "*"
ros-jazzy-gz-ros2-control = "*"

# Off-board inference env: torch + the depth/detect servers, no ROS. Runs on the
# "inference machine" (a GPU box, or the same box as the robot/sim via 127.0.0.1).
[feature.inference.dependencies]
numpy = ">=1.26,<3"
pillow = ">=10,<13"
pytorch = ">=2,<3"
# scipy: undeclared requirement of transformers' Owlv2ImageProcessor
scipy = ">=1,<2"
transformers = ">=4,<5"

# -u: the servers log by printing; unbuffered stdout so the lines survive
# redirection to a file (block buffering otherwise holds them indefinitely)
[feature.inference.tasks]
# Both servers together — the usual way to run a dedicated inference machine.
inference = "python -u mote_perception/tools/inference_server.py"
# Or one model at a time (e.g. depth-server --metric, or to save VRAM).
depth-server = "python -u mote_perception/tools/depth_server.py"
detect-server = "python -u mote_perception/tools/detect_server.py"
# Warm the HuggingFace cache so the first request doesn't block on a download.
inference-prefetch = "python -u mote_perception/tools/prefetch_models.py"

# GPU-accelerated sibling of the `inference` feature (env `inference-rocm`). Same
# depth/detect servers, but torch comes from the pytorch.org ROCm wheel index
# instead of conda-forge so inference can run on an AMD GPU. Kept a separate env so
# the CPU `inference` env, the robot/Pi default env, and their solves are
# untouched. The ROCm wheels bundle their own userspace (no system ROCm needed) and
# only publish cp3.x up to 3.12, so python is pinned here (the CPU inference env
# floats to 3.14). numpy/pillow/scipy stay on conda; only torch + transformers come
# from PyPI so pip resolves torch against the ROCm index rather than pulling conda's
# CPU pytorch. x86_64-only: the wheels have no aarch64 build and the aarch64 robot
# never runs this workstation feature.
[feature.inference-rocm]
platforms = ["linux-64"]

[feature.inference-rocm.dependencies]
python = "3.12.*"
numpy = ">=1.26,<3"
pillow = ">=10,<13"
# scipy: undeclared requirement of transformers' Owlv2ImageProcessor
scipy = ">=1,<2"

[feature.inference-rocm.pypi-dependencies]
torch = { version = ">=2.8,<3", index = "https://download.pytorch.org/whl/rocm6.4" }
pytorch-triton-rocm = { version = "*", index = "https://download.pytorch.org/whl/rocm6.4" }
transformers = ">=4,<5"

# gfx1103 (Phoenix3 RDNA3 iGPU) is not an officially supported ROCm target; the
# standard workaround is to masquerade as gfx1100. Set here so it applies to every
# `pixi run -e inference-rocm` invocation without manual exporting.
[feature.inference-rocm.activation.env]
HSA_OVERRIDE_GFX_VERSION = "11.0.0"

# GPU-suffixed names so the CPU tasks (`inference`, `depth-server`, `detect-server`)
# stay unambiguous; `inference-rocm` runs both servers on the GPU (the servers'
# --device auto picks the GPU when present), the single-server variants save VRAM.
[feature.inference-rocm.tasks]
inference-rocm = "python -u mote_perception/tools/inference_server.py"
depth-server-rocm = "python -u mote_perception/tools/depth_server.py"
detect-server-rocm = "python -u mote_perception/tools/detect_server.py"
inference-prefetch-rocm = "python -u mote_perception/tools/prefetch_models.py"

# The fleet-server role: an MQTT broker and the enrollment/registry API, with no
# ROS at all. Its own env (no-default-feature) because the fleet box is not a
# robot and should not have to solve the robot's stack to run a broker and a
# stdlib HTTP server — the same separation the inference env makes for the GPU
# box. The dev env folds this feature in as well, so a workstation can run the
# whole control plane (broker included) next to a sim or a real robot.
[feature.fleet.dependencies]
mosquitto = ">=2.0,<3"
paho-mqtt = ">=2,<3"
pytest = ">=8,<9"

[feature.fleet.tasks]
fleet-broker = "bash mote_fleet/server/broker.sh"
# Repeated from [tasks] because this environment takes no default feature: a
# fleet box that is not a robot still has to be able to run the fleet server.
fleet-broker-ws = "bash mote_fleet/server/broker.sh --docker"
fleet-server = "python -u mote_fleet/server/fleet_server.py"
fleetctl = "python -u mote_fleet/server/fleetctl.py"
# Runs everywhere the deps allow: rclpy tests skip without ROS, the broker test
# skips without mosquitto, so the same file is the CI unit run and the local
# end-to-end run (see mote_fleet/test/test_e2e_fleet.py).
test-fleet = "pytest mote_fleet/test -q"
# M2's teleop path against the real bridge; needs the dev env's WebSocket client.
test-foxglove = "pytest mote_bringup/test/test_foxglove_teleop.py -q"

[feature.lint.dependencies]
pre-commit = ">=4,<5"

[activation]
scripts = ["install/setup.sh"]
# Discovery range is deliberately left at the ROS default here: the robot must
# stay discoverable by an operator's RViz until Foxglove gives it an off-box path
# (fleet M2). Sims/benchmarks pin themselves to LOCALHOST above; the robot's DDS
# is scoped instead by config/cyclonedds.xml under systemd.
env = { RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp" }

[environments]
# dev also carries the fleet feature: a workstation is where the whole control
# plane gets exercised at once (broker + server + agent + a real behaviour tree).
dev = { features = ["dev", "fleet"], solve-group = "default" }
# The fleet-server role: broker + registry API, no ROS. Own solve.
fleet = { features = ["fleet"], no-default-feature = true }
# Own solve (no solve-group) so sim deps can never shift the robot/Pi env
sim = { features = ["sim"] }
inference = { features = ["inference"], no-default-feature = true }
inference-rocm = { features = ["inference-rocm"], no-default-feature = true }
# ^ GPU sibling of `inference`; own solve (no solve-group) so the ROCm torch wheel
# can never perturb any other env.
# Minimal env (no ROS) so 'pixi run lint' is fast to solve and install
lint = { features = ["lint"], no-default-feature = true }
