[workspace]
authors = ["Michael Johnson <michael@clach.dev>"]
channels = ["https://prefix.dev/mote", "robostack-jazzy", "conda-forge"]
name = "mote"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
submodules = "git submodule update --init"
build = { cmd = "colcon build --symlink-install --cmake-args -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5", depends-on = [
    "submodules",
] }
clean = "pkill -9 -f 'robot_state_publisher|ros2_control_node|sllidar|v4l2_camera|spawner'; ros2 daemon stop; rm -f /dev/shm/fast*; ros2 daemon start; true"
install-systemd = "bash mote_bringup/systemd/install.sh"
launch = "ros2 launch mote_bringup mote_launch.py"
nav = "ros2 launch mote_bringup nav2_launch.py map:=$HOME/.mote/map.yaml"
robot = "ros2 launch mote_bringup robot_launch.py"
save-map = "mkdir -p $HOME/.mote && ros2 run nav2_map_saver map_saver_cli -f $HOME/.mote/map"
slam = "ros2 launch mote_bringup slam_launch.py"
sync = "rsync -avz --exclude='.pixi/' --exclude='build/' --exclude='install/' --exclude='log/' --exclude='.git/' --exclude='.claude/' . michael@mote:~/Mote/"
teleop = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p stamped:=true -r /cmd_vel:=/diff_drive_controller/cmd_vel"
udev = "sudo cp mote_bringup/udev/99-mote.rules /etc/udev/rules.d/ && sudo udevadm control --reload-rules && sudo udevadm trigger"
setup-ids = "ros2 run mote_hardware setup_ids"
test = { cmd = "colcon test --packages-select mote_hardware --event-handlers console_direct+ && colcon test-result --verbose", depends-on = [
    "build",
] }

[dependencies]
cmake = ">=4.3.2,<5"
colcon-common-extensions = ">=0.3.0,<0.4"
compilers = ">=1.11.0,<2"
filelock = ">=3.12.2"
libcap = ">=2.77,<3"
lttng-ust = ">=2.13.9,<3"
ninja = ">=1.13.2,<2"
pkg-config = ">=0.29.2,<0.30"
ros-jazzy-ament-cmake-auto = ">=2.5.5,<3"
ros-jazzy-ament-lint-auto = ">=0.17.4,<0.18"
ros-jazzy-image-transport-plugins = ">=3.0.0"
ros-jazzy-laser-filters = ">=2.0.0"
ros-jazzy-nav2-amcl = ">=1.3.0"
ros-jazzy-nav2-behaviors = ">=1.3.0"
ros-jazzy-nav2-bt-navigator = ">=1.3.0"
ros-jazzy-nav2-controller = ">=1.3.0"
ros-jazzy-nav2-costmap-2d = ">=1.3.0"
ros-jazzy-nav2-dwb-controller = ">=1.3.0"
ros-jazzy-nav2-lifecycle-manager = ">=1.3.0"
ros-jazzy-nav2-map-server = ">=1.3.0"
ros-jazzy-nav2-mppi-controller = ">=1.3.0"
ros-jazzy-nav2-navfn-planner = ">=1.3.0"
ros-jazzy-nav2-planner = ">=1.3.0"
ros-jazzy-nav2-regulated-pure-pursuit-controller = ">=1.3.0"
ros-jazzy-nav2-rotation-shim-controller = ">=1.3.0"
ros-jazzy-nav2-smac-planner = ">=1.3.0"
ros-jazzy-nav2-smoother = ">=1.3.0"
ros-jazzy-nav2-waypoint-follower = ">=1.3.0"
ros-jazzy-rmw-cyclonedds-cpp = ">=1.3.0"
ros-jazzy-robot-state-publisher = ">=3.0.0"
ros-jazzy-ros2-control = ">=4.43.0,<5"
ros-jazzy-ros2-controllers = ">=4.37.0,<5"
ros-jazzy-ros2launch = ">=0.11.0"
ros-jazzy-ros2lifecycle = ">=0.18.0"
ros-jazzy-ros2run = ">=0.18.0"
ros-jazzy-rosbag2-cpp = ">=0.26.0"
ros-jazzy-rosbag2-storage = ">=0.26.0"
ros-jazzy-slam-toolbox = ">=2.8.4,<3"
ros-jazzy-teleop-twist-keyboard = ">=1.0.0"
ros-jazzy-v4l2-camera = ">=0.7.1,<0.8"
ros-jazzy-xacro = ">=2.0.0"
scservo-linux = "==1.0.0"
ros-jazzy-ament-cmake-gtest = ">=2.5"

[feature.dev.dependencies]
ros-jazzy-desktop = ">=0.11.0"
ros-jazzy-nav2-bringup = ">=1.3.11,<2"

[feature.dev.tasks]
rviz = "ros2 launch mote_bringup rviz_launch.py"

[feature.sim.dependencies]
ros-jazzy-ros-gz-sim = "*"
ros-jazzy-ros-gz-bridge = "*"
ros-jazzy-gz-ros2-control = "*"

[activation]
scripts = ["install/setup.sh"]
env = { RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp" }

[environments]
dev = { features = ["dev"], solve-group = "default" }
# Own solve (no solve-group) so sim deps can never shift the robot/Pi env
sim = { features = ["sim"] }
