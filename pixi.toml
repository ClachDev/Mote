[workspace]
authors = ["Michael Johnson <mjohnson459@gmail.com>"]
channels = ["robostack-jazzy","conda-forge"]
name = "auldbot"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
submodules = "git submodule update --init"
build = { cmd = "colcon build --symlink-install --cmake-args -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5", depends-on = ["submodules"] }
udev = "sudo cp auldbot_bringup/udev/99-auldbot.rules /etc/udev/rules.d/ && sudo udevadm control --reload-rules && sudo udevadm trigger"
install-systemd = "sudo cp auldbot_bringup/systemd/*.service /etc/systemd/system/ && sudo systemctl daemon-reload && sudo systemctl enable auldbot-bringup auldbot-slam auldbot-nav"
sync = "rsync -avz --delete --exclude='.pixi/' --exclude='build/' --exclude='install/' --exclude='log/' --exclude='.git/' --exclude='.claude/' . michael@auldbot:~/AuldBot/"
launch = "ros2 launch auldbot_bringup auldbot_launch.py"
robot = "ros2 launch auldbot_bringup robot_launch.py"
clean = "pkill -9 -f 'robot_state_publisher|ros2_control_node|sllidar|v4l2_camera|spawner'; ros2 daemon stop; rm -f /dev/shm/fast*; ros2 daemon start; true"
teleop = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p stamped:=true -r /cmd_vel:=/diff_drive_controller/cmd_vel"
slam = "ros2 launch auldbot_bringup slam_launch.py"
nav = "ros2 launch auldbot_bringup nav2_launch.py"

[dependencies]
ros-jazzy-turtlesim = ">=1.8.3,<2"
colcon-common-extensions = ">=0.3.0,<0.4"
ros-jazzy-xacro = ">=2.0.0"
ros-jazzy-robot-state-publisher = ">=3.0.0"
ros-jazzy-ros2-control = ">=4.43.0,<5"
ros-jazzy-ros2-controllers = ">=4.37.0,<5"
ros-jazzy-v4l2-camera = ">=0.7.1,<0.8"
ros-jazzy-image-transport-plugins = ">=3.0.0"
ros-jazzy-slam-toolbox = ">=2.8.4,<3"
ros-jazzy-nav2-lifecycle-manager = ">=1.3.0"
ros-jazzy-nav2-controller = ">=1.3.0"
ros-jazzy-nav2-smoother = ">=1.3.0"
ros-jazzy-nav2-planner = ">=1.3.0"
ros-jazzy-nav2-behaviors = ">=1.3.0"
ros-jazzy-nav2-bt-navigator = ">=1.3.0"
ros-jazzy-nav2-waypoint-follower = ">=1.3.0"
ros-jazzy-nav2-navfn-planner = ">=1.3.0"
ros-jazzy-nav2-mppi-controller = ">=1.3.0"
ros-jazzy-nav2-costmap-2d = ">=1.3.0"
ros-jazzy-nav2-map-server = ">=1.3.0"
ros-jazzy-laser-filters = ">=2.0.0"
ros-jazzy-teleop-twist-keyboard = ">=1.0.0"
ros-jazzy-rosbag2-cpp = ">=0.26.0"
ros-jazzy-rosbag2-storage = ">=0.26.0"
ros-jazzy-ros2run = ">=0.18.0"
ros-jazzy-ament-lint-auto = ">=0.17.4,<0.18"
ros-jazzy-rmw-cyclonedds-cpp = ">=1.3.0"
libcap = ">=2.77,<3"
lttng-ust = ">=2.13.9,<3"
ros-jazzy-ros2launch = ">=0.11.0"
filelock = ">=3.12.2"
ros-jazzy-ament-cmake-auto = ">=2.5.5,<3"
compilers = ">=1.11.0,<2"
pkg-config = ">=0.29.2,<0.30"
ninja = ">=1.13.2,<2"
cmake = ">=4.3.2,<5"

[feature.dev.dependencies]
ros-jazzy-desktop = ">=0.11.0"
ros-jazzy-nav2-bringup = ">=1.3.11,<2"

[feature.dev.tasks]
rviz = "ros2 launch auldbot_bringup rviz_launch.py"

[activation]
scripts = ["install/setup.sh"]
env = { RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp" }

[environments]
dev = { features = ["dev"], solve-group = "default" }
