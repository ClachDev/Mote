[workspace]
authors = ["Michael Johnson <michael@clach.dev>"]
channels = ["https://prefix.dev/mote", "robostack-jazzy", "conda-forge"]
name = "mote"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"
repository = "https://github.com/ClachDev/Mote"
description = "Low-cost differential-drive robot combining the Physical AI pipeline of LeKiwi with ROS/Nav2 navigation on a Turtlebot 3-compatible base. Circular footprint, ORP-standard chassis, SO-101 arm compatible. A comparison platform for classical navigation vs. learned robot policies."
license-file = "LICENSE"

# Features and environments. `robot` is what a robot runs; `build` is the
# toolchain that compiles it from a checkout; `dev` is the workstation's extras.
# The default environment is robot + build, which is what the Pi installs and
# what a bare `pixi run <task>` uses on either machine. `dev` adds desktop, sim
# and the fleet server on top. The off-board roles (fleet, inference, lint,
# docs) are their own environments and carry none of the robot's stack.
#
# A task defined in `robot` or `build` exists in both `default` and `dev`, and
# pixi then picks `default`. A task defined only in `dev`, `sim` or another
# single-environment feature runs in that environment with no `-e`.

# build: compile the workspace from a checkout. Nothing here is needed to run
# the robot, and the release deploy manifest leaves it out.
[feature.build.dependencies]
cmake = ">=4.3.2,<5"
colcon-common-extensions = ">=0.3.0,<0.4"
compilers = ">=1.11.0,<2"
ninja = ">=1.13.2,<2"
pkg-config = ">=0.29.2,<0.30"
ros-jazzy-ament-cmake-auto = ">=2.5.5,<3"
ros-jazzy-ament-cmake-gtest = ">=2.5"
ros-jazzy-ament-lint-auto = ">=0.17.4,<0.18"

[feature.build.activation.env]
CMAKE_GENERATOR = "Ninja"
CMAKE_BUILD_TYPE = "Release"
# CMake 4 dropped compatibility with cmake_minimum_required < 3.5. Sophus and
# tessil's robin-map, fetched by kinematic_icp, still declare one.
CMAKE_POLICY_VERSION_MINIMUM = "3.5"

[feature.build.tasks]
submodules = { cmd = "git submodule update --init", description = "Fetch the git submodules" }
build = { cmd = "colcon build --symlink-install", description = "colcon build, symlink install", depends-on = ["submodules"] }
test = { cmd = "colcon test --event-handlers console_cohesion+ && colcon test-result --verbose", description = "colcon test, then fail on any failed test", depends-on = [
    "build",
] }

# robot: the stack a robot runs, and the tasks typed on a robot.
[feature.robot.dependencies]
filelock = ">=3.12.2"
libcap = ">=2.77,<3"
lttng-ust = ">=2.13.9,<3"
paho-mqtt = ">=2,<3"
pillow = ">=10,<13"
ros-jazzy-image-transport-plugins = ">=3.0.0"
ros-jazzy-laser-filters = ">=2.0.0"
ros-jazzy-nav2-amcl = ">=1.3.0"
ros-jazzy-nav2-behaviors = ">=1.3.0"
ros-jazzy-nav2-bt-navigator = ">=1.3.0"
ros-jazzy-nav2-controller = ">=1.3.0"
ros-jazzy-nav2-costmap-2d = ">=1.3.0"
ros-jazzy-nav2-dwb-controller = ">=1.3.0"
ros-jazzy-nav2-lifecycle-manager = ">=1.3.0"
ros-jazzy-nav2-map-server = ">=1.3.0"
ros-jazzy-nav2-mppi-controller = ">=1.3.0"
ros-jazzy-nav2-navfn-planner = ">=1.3.0"
ros-jazzy-nav2-planner = ">=1.3.0"
ros-jazzy-nav2-regulated-pure-pursuit-controller = ">=1.3.0"
ros-jazzy-nav2-rotation-shim-controller = ">=1.3.0"
ros-jazzy-nav2-smac-planner = ">=1.3.0"
ros-jazzy-nav2-smoother = ">=1.3.0"
ros-jazzy-nav2-waypoint-follower = ">=1.3.0"
ros-jazzy-rmw-cyclonedds-cpp = ">=1.3.0"
ros-jazzy-robot-state-publisher = ">=3.0.0"
ros-jazzy-ros2-control = ">=4.43.0,<5"
ros-jazzy-ros2-controllers = ">=4.37.0,<5"
ros-jazzy-ros2launch = ">=0.11.0"
ros-jazzy-ros2lifecycle = ">=0.18.0"
ros-jazzy-ros2run = ">=0.18.0"
ros-jazzy-rosbag2-cpp = ">=0.26.0"
ros-jazzy-rosbag2-storage = ">=0.26.0"
ros-jazzy-ros2bag = ">=0.26.0"
ros-jazzy-rosbag2-transport = ">=0.26.0"
ros-jazzy-rosbag2-storage-mcap = ">=0.26.0"
ros-jazzy-slam-toolbox = ">=2.8.4,<3"
# camera_layer. Not in the nav2 set above; without it the costmap loads silently without the layer.
ros-jazzy-spatio-temporal-voxel-layer = ">=2.5.5,<3"
ros-jazzy-teleop-twist-keyboard = ">=1.0.0"
# >=4.5 for `use_stamped`.
ros-jazzy-twist-mux = ">=4.5.0,<5"
ros-jazzy-foxglove-bridge = ">=3.3.0,<4"
ros-jazzy-v4l2-camera = ">=0.7.1,<0.8"
ros-jazzy-vision-msgs = ">=4.1.0"
ros-jazzy-xacro = ">=2.0.0"
# mote_health builds against it; transitive today, so named rather than borrowed.
ros-jazzy-yaml-cpp-vendor = ">=9.0.0"
urdfdom = ">=6"
scservo-linux = "==1.0.0"

[feature.robot.pypi-dependencies]
py-trees = ">=2.2,<3"
# imports as scservo_sdk
feetech-servo-sdk = ">=1.0"

[feature.robot.activation]
scripts = ["install/setup.sh"]

[feature.robot.activation.env]
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
CYCLONEDDS_URI = "file://$PIXI_PROJECT_ROOT/mote_bringup/config/cyclonedds.xml"

[feature.robot.tasks]
setup = { cmd = "bash mote_bringup/setup.sh", description = "One-time Pi setup: udev + systemd + wifi (sudo); `setup wifi` etc. runs one part" }
setup-ids = { cmd = "ros2 run mote_hardware setup_ids", description = "Assign servo IDs one servo at a time (bench prep)" }
wifi-check = { cmd = "bash mote_bringup/wifi/check.sh", description = "Who takes the wifi roam decision" }
wifi-roamlog = { cmd = "bash mote_bringup/wifi/roamlog.sh", description = "Follow the wifi roaming log" }

fleet = { cmd = "ros2 run mote_fleet fleet", description = "Robot side of the fleet: enroll / publish-map / join" }
identity = { cmd = "ros2 run mote_bringup identity", description = "This robot's fleet identity: show / id / set" }
dds-check = { cmd = "ros2 run mote_bringup dds_participants", description = "DDS participant-slot headroom on this host" }

launch = { cmd = "ros2 launch mote_bringup mote_launch.py", description = "Hardware base: drivers, lidar, camera, localization" }
mapping = { cmd = "ros2 launch mote_bringup mapping_launch.py", description = "Base + SLAM: build or extend a map" }
nav = { cmd = "ros2 launch mote_bringup nav2_launch.py", description = "Nav2 on the active site's map (beside launch)" }
robot = { cmd = "ros2 launch mote_bringup robot_launch.py", description = "Base + Nav2: drive the active site's map" }
slam = { cmd = "ros2 launch mote_bringup slam_launch.py", description = "SLAM stack only (beside launch)" }
agent = { cmd = "ros2 launch mote_fleet agent_launch.py", description = "Robot -> fleet bridge (mote-agent.service)" }
teleop = { cmd = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p stamped:=true -r /cmd_vel:=/cmd_vel_teleop_stamped", description = "Keyboard teleop; overrides Nav2 while keys are held" }
explore = { cmd = "ros2 run mote_bringup explore", description = "Autonomous mapping coverage beside `mapping`" }
perception = { cmd = "ros2 launch mote_perception perception_launch.py", description = "Camera perception nodes (inference off-board)" }
foxglove = { cmd = "ros2 launch mote_bringup foxglove_launch.py", description = "foxglove_bridge + teleop relay: the remote console" }
record = { cmd = "ros2 launch mote_bringup record_launch.py", description = "Record the mission's bag streams" }
tasks = { cmd = "ros2 launch mote_tasks tasks_launch.py", description = "Behaviour-tree task server (missions)" }
health = { cmd = "ros2 run mote_health health_monitor", description = "Health monitor on its own" }
self-check = { cmd = "ros2 run mote_bringup self_check", description = "Pre-flight check: servos, lidar, camera, disk, clock, config" }
slip = { cmd = "ros2 run mote_bringup slip_monitor", description = "Wheel-vs-lidar slip monitor on its own" }
slip-replay = { cmd = "python mote_bringup/tools/slip_replay.py", description = "Re-score recorded bags through the slip estimator" }

site = { cmd = "ros2 run mote_bringup site", description = "Sites CLI: create / add-floor / use / use-map / list / info / save-map / save-zone / clean / segment" }

arm = { cmd = "ros2 launch mote_bringup arm_launch.py", description = "SO-101 bench control stack (ros2_control, no mission)" }
arm-pose = { cmd = "ros2 run mote_arm arm_pose", description = "Teach / replay named arm poses; narrow the envelope" }
arm-setup = { cmd = "ros2 run mote_arm arm_setup", description = "Arm bus tools: check / calibrate / gains / offsets / limits (stack stopped)" }
arm-teleop = { cmd = "ros2 run mote_arm arm_teleop", description = "Keyboard arm teleop: clamped, rate-limited goals" }
arm-record = { cmd = "ros2 run mote_arm episode_record", description = "Record teleop episodes into $MOTE_HOME/episodes" }
arm-replay = { cmd = "ros2 run mote_arm episode_replay", description = "Replay an episode on the arm at reduced speed" }

inference-health = { cmd = "python -u mote_perception/tools/inference_health.py", description = "Probe the inference machine's health and version" }
inference-bench = { cmd = "python -u mote_perception/tools/inference_bench.py", description = "Benchmark inference round-trip latency" }

chaos = { cmd = "bash mote_bringup/test/chaos/chaos_restart.sh", description = "Chaos test: restart units on a live robot" }
node-cpu = { cmd = "python mote_bringup/tools/node_cpu.py", description = "Per-node CPU on a live robot" }

kill = { cmd = "python -m mote_bringup.sweep_orphans --scope . --kill; ros2 daemon stop; rm -f /dev/shm/fast*; ros2 daemon start; true", description = "Kill this checkout's ROS processes and reset the daemon" }
sweep = { cmd = "python -m mote_bringup.sweep_orphans", description = "Report ROS processes leaked by dead agent jobs (--kill reaps)" }

# dev: the workstation. Desktop tools, and tasks that are typed at a
# workstation even when they only need the robot's stack.
[feature.dev.dependencies]
ros-jazzy-desktop = ">=0.11.0"
ros-jazzy-nav2-bringup = ">=1.3.11,<2"
# The /particle_cloud display; rviz_default_plugins mistypes that topic.
ros-jazzy-nav2-rviz-plugins = ">=1.3.0"
ros-jazzy-camera-calibration = "*"
# Undeclared runtime dependency of camera_calibration.
semver = ">=3,<4"
watchexec = ">=2.5,<3"
# test_foxglove_teleop.py
websockets = ">=12,<16"

[feature.dev.target.linux-64.dependencies]
ros-jazzy-rviz-teleop-panel = ">=0.1.0"

[feature.dev.tasks]
rviz = { cmd = "ros2 launch mote_bringup rviz_launch.py", description = "RViz2 with the mote config" }
camera-calibrate = { cmd = "bash mote_perception/tools/camera_calibrate.sh", description = "Bench prep: camera intrinsics with the camera on this machine" }

sync = { cmd = "rsync -avz --exclude='.pixi/' --exclude='build/' --exclude='install/' --exclude='log/' --exclude='.git' --exclude='.claude/' --exclude='mote_simulation/' --exclude='__pycache__/' . michael@auldbot:~/Mote/", description = "rsync the checkout to the Pi" }
sync-watch = { cmd = "watchexec --debounce 1s -- pixi run sync", description = "rsync to the Pi on every save" }

provision = { cmd = "ros2 run mote_bringup provision", description = "Render cloud-init user-data for a new Pi" }
tailnet = { cmd = "bash mote_bringup/tailscale/install.sh", description = "Join this machine to the Tailscale overlay (sudo)" }

fleet-ui-check = { cmd = "python -u mote_fleet/test/ui_check.py", description = "Dashboard check in headless Chrome against a fake fleet (docker)" }

fleet-deploy = { cmd = "bash mote_fleet/deploy/fleet-deploy.sh", description = "Fleet box: container stack up / update / rollback / backup" }
inference-deploy = { cmd = "bash mote_perception/deploy/inference-deploy.sh", description = "GPU box: blue/green inference deploy" }
deploy-test = { cmd = "bash mote_perception/deploy/test/drill.sh", description = "Blue/green deploy drill, stubbed, no GPU" }

segment-eval = { cmd = "python mote_simulation/test/room_segmentation_eval.py", description = "Score room segmentation against ground-truth rooms" }
bag-replay = { cmd = "python mote_simulation/tools/bag_replay/replay.py", description = "Replay a mapping bag through SLAM under N parameter sets" }
camera-decay-check = { cmd = "python mote_bringup/tools/camera_layer_decay.py", description = "Time a camera_layer mark expiring on a real costmap (~40 s)" }

arm-mock = { cmd = "ros2 run mote_arm mock_arm", description = "The arm control stack's interface with no hardware" }
arm-teleop-test = { cmd = "bash mote_arm/test/teleop_loop/run_teleop_loop.sh", description = "Headless teleop -> record -> replay loop against the mock arm" }

# sim: Gazebo
[feature.sim.dependencies]
ros-jazzy-ros-gz-sim = "*"
ros-jazzy-ros-gz-bridge = "*"
ros-jazzy-gz-ros2-control = "*"

[feature.sim.activation.env]
MOTE_HOME = "$PIXI_PROJECT_ROOT/mote_simulation/sim_home"
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"

[feature.sim.tasks]
sim = { cmd = "ros2 launch mote_simulation sim_launch.py", description = "Headless Gazebo: world + robot + controllers (world:=...)" }
sim-mapping = { cmd = "ros2 launch mote_simulation sim_launch.py mode:=mapping", description = "sim mode:=mapping (the real mapping launch)" }
sim-nav = { cmd = "ros2 launch mote_simulation sim_launch.py mode:=nav", description = "sim mode:=nav (the real robot launch + saved map)" }
sim-map-world = { cmd = "bash mote_simulation/tools/map_world.sh", description = "Build a world's committed site by mapping it with SLAM" }
bench = { cmd = "python mote_simulation/tools/benchmark/bench.py", description = "Nav benchmark against Gazebo ground truth" }
bench-sweep = { cmd = "python mote_simulation/tools/benchmark/sweep/sweep.py", description = "Benchmark per parameter set, ranked against the baseline" }
sim-test = { cmd = "bash mote_simulation/test/sim_smoke/run_sim_smoke.sh", description = "~20 s headless smoke test (pre-PR gate, GPU)", depends-on = [
    "build",
] }
sim-map-reload-test = { cmd = "bash mote_simulation/test/map_reload/run_map_reload.sh", description = "A promoted map loads into a running Nav2 (~2 min, GPU)", depends-on = [
    "build",
] }

# inference: torch + the depth/detect servers, no ROS. The GPU box.
[feature.inference.dependencies]
numpy = ">=1.26,<3"
pillow = ">=10,<13"
pytorch = ">=2,<3"
# Undeclared requirement of transformers' Owlv2ImageProcessor.
scipy = ">=1,<2"
transformers = ">=4,<5"

[feature.inference.tasks]
inference = { cmd = "python -u mote_perception/tools/inference_server.py", description = "Depth + detect inference servers (GPU box)" }
depth-server = { cmd = "python -u mote_perception/tools/depth_server.py", description = "Depth inference server alone" }
detect-server = { cmd = "python -u mote_perception/tools/detect_server.py", description = "Open-vocabulary detection server alone" }
inference-prefetch = { cmd = "python -u mote_perception/tools/prefetch_models.py", description = "Warm the HuggingFace model cache" }

# fleet: the MQTT broker and the enrollment/registry API, no ROS. The fleet box.
[feature.fleet.dependencies]
mosquitto = ">=2.0,<3"
paho-mqtt = ">=2,<3"
pyyaml = ">=6,<7"
pillow = ">=10,<13"
pytest = ">=8,<9"

[feature.fleet.tasks]
fleet-server = { cmd = "python -u mote_fleet/server/fleet_server.py", description = "Fleet API + operator dashboard" }
fleetctl = { cmd = "python -u mote_fleet/server/fleetctl.py", description = "Operator CLI: token / operator / robots / dispatch / promote / audit / watch" }
fleet-broker = { cmd = "bash mote_fleet/server/broker.sh", description = "MQTT broker with WebSockets, in a container (docker)" }
fleet-broker-local = { cmd = "bash mote_fleet/server/broker.sh --local", description = "conda's mosquitto: no WebSockets, no dashboard" }
test-fleet = { cmd = "pytest mote_fleet/test -q", description = "mote_fleet tests incl. the broker e2e" }

[feature.lint.dependencies]
pre-commit = ">=4,<5"

[feature.lint.tasks]
lint = { cmd = "pre-commit run --all-files", description = "All pre-commit hooks" }
lint-install = { cmd = "pre-commit install", description = "Wire pre-commit into .git/hooks" }

[feature.docs.dependencies]
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.7,<10"

[feature.docs.tasks]
docs = { cmd = "mkdocs serve", description = "Serve the mkdocs site" }
docs-build = { cmd = "mkdocs build --strict", description = "Build the docs site, --strict (CI)" }

[environments]
default = { features = ["robot", "build"], solve-group = "default" }
dev = { features = ["dev", "robot", "build", "fleet", "sim"], solve-group = "default" }
fleet = { features = ["fleet"], no-default-feature = true }
inference = { features = ["inference"], no-default-feature = true }
lint = { features = ["lint"], no-default-feature = true }
docs = { features = ["docs"], no-default-feature = true }
